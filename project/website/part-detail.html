<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Ray Part — Penn Radiant</title>
<meta name="description" content="Space-Ray replacement part detail from Penn Radiant — photos, compatible heater, and request a quote.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://www.pennradiant.com/part-detail.html">
<meta property="og:type" content="product">
<meta property="og:site_name" content="Penn Radiant Products">
<meta property="og:image" content="https://www.pennradiant.com/assets/headers/parts.jpg">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="styles.css?v=68">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <link rel="shortcut icon" href="favicon.ico">
<script src="sr-parts-data.js?v=20"></script>
<style>
.pd-wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:38px;align-items:start}
@media(max-width:820px){.pd-wrap{grid-template-columns:1fr;gap:22px}}
.pd-gallery .main{position:relative;height:380px;background:#fff;border:1px solid var(--prp-gray-150);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:22px;overflow:hidden}
.pd-gallery .main.zoomable{cursor:zoom-in}
.pd-gallery .main img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .18s ease-out}
.pd-zoom-btn{position:absolute;bottom:12px;right:12px;width:42px;height:42px;border-radius:50%;border:1px solid var(--prp-gray-150);background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center;cursor:zoom-in;color:var(--prp-ink);box-shadow:0 2px 8px rgba(0,0,0,.14);z-index:2}
.pd-zoom-btn:hover{color:var(--prp-red);border-color:var(--prp-red)}
.pd-lightbox{position:fixed;inset:0;background:rgba(15,18,22,.9);z-index:9999;display:flex;align-items:center;justify-content:center;padding:34px;cursor:zoom-out}
.pd-lightbox img{max-width:96%;max-height:96%;object-fit:contain}
.pd-lb-close{position:absolute;top:18px;right:24px;background:none;border:none;color:#fff;cursor:pointer;opacity:.85}
.pd-lb-close:hover{opacity:1}
.pd-thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.pd-thumbs button{width:72px;height:72px;border:1px solid var(--prp-gray-150);border-radius:8px;background:#fff;padding:6px;cursor:pointer;overflow:hidden}
.pd-thumbs button.on{border-color:var(--prp-red);box-shadow:0 0 0 1px var(--prp-red)}
.pd-thumbs img{width:100%;height:100%;object-fit:contain}
.pd-info .eyebrow{color:var(--prp-red);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:12.5px}
.pd-pn{font-size:34px;font-weight:900;letter-spacing:.01em;color:var(--prp-ink);margin:6px 0 2px}
.pd-nm{font-size:19px;color:var(--fg-2,#4a5568);margin:0 0 16px}
.pd-quote-box{border:1px solid var(--prp-gray-150);border-radius:12px;padding:18px 20px;background:var(--prp-gray-100,#f7f8f9)}
.pd-quote-box .lbl{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-3,#7a8794);font-weight:800}
.pd-quote-box .price{font-size:22px;font-weight:900;color:var(--prp-ink);margin:2px 0 12px}
.pd-spec{margin:20px 0;border-top:1px solid var(--prp-gray-150)}
.pd-spec .row{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--prp-gray-100,#eee);font-size:14.5px}
.pd-spec .k{flex:0 0 130px;color:var(--fg-3,#7a8794);font-weight:700}
.pd-spec .v{color:var(--prp-ink)}
.pd-heater{margin-top:30px;border:1px solid var(--prp-gray-150);border-radius:12px;overflow:hidden;display:grid;grid-template-columns:240px 1fr}
@media(max-width:620px){.pd-heater{grid-template-columns:1fr}}
.pd-heater .him{background:#fff;display:flex;align-items:center;justify-content:center;padding:16px;border-right:1px solid var(--prp-gray-150)}
.pd-heater .him img{max-width:100%;max-height:170px;object-fit:contain}
.pd-heater .htx{padding:18px 20px}
.pd-heater .htx h3{margin:0 0 6px;font-size:18px}
.pd-heater .htx p{margin:0;color:var(--fg-2,#4a5568);font-size:14px;line-height:1.5}
.pd-back{display:inline-flex;align-items:center;gap:5px;color:var(--prp-red);font-weight:700;text-decoration:none;font-size:14px}
.pd-note{border-left:3px solid var(--prp-red);background:var(--prp-gray-100,#f7f8f9);border-radius:0 10px 10px 0;padding:13px 16px;margin:18px 0 0;font-size:14px;line-height:1.55;color:var(--fg-2,#4a5568)}
.pd-note b{color:var(--prp-ink)}
.pd-related{margin-top:22px}
.pd-related h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-3,#7a8794);font-weight:800;margin:0 0 10px}
.pd-rel-card{display:flex;align-items:center;gap:14px;border:1px solid var(--prp-gray-150);border-radius:12px;padding:11px 14px;text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s}
.pd-rel-card:hover{border-color:var(--prp-red);box-shadow:0 4px 14px rgba(0,0,0,.07)}
.pd-rel-card .rim{width:64px;height:64px;flex:none;background:#fff;border:1px solid var(--prp-gray-150);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:6px}
.pd-rel-card .rim img{max-width:100%;max-height:100%;object-fit:contain}
.pd-rel-card .rtx{flex:1;min-width:0}
.pd-rel-card .rpn{display:block;font-weight:900;color:var(--prp-ink);font-size:15px}
.pd-rel-card .rnm{display:block;font-size:13px;color:var(--fg-2,#4a5568);line-height:1.4;margin-top:1px}
.pd-rel-card .rgo{flex:none;color:var(--prp-red);font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:3px}
</style>

</head>
<body>
<div id="root"></div>
<script type="text/babel" src="site.jsx?v=26"></script>
<script type="text/babel">
const { useState } = React;
const A = PRP_A, I = PRP_I;
const CATS = {"tube":{label:"Tube Heater Parts",page:"space-ray-tube-parts.html"},"ceramic":{label:"Ceramic Heater Parts",page:"space-ray-ceramic-parts.html"},"salamander":{label:"Salamander / Floor Model Parts",page:"space-ray-salamander-parts.html"}};
const PARAMS = new URLSearchParams(window.location.search);
const P = (window.SR_PARTS||[]).find(x=>x.id===PARAMS.get("pn"));
function NotFound() {
  return (<div className="wrap section" style={{textAlign:"center"}}>
    <h1>Part not found</h1>
    <p><a href="space-ray-parts.html">Browse Space Ray parts →</a></p>
  </div>);
}
function ZoomMain({ src, alt }) {
  const [zoom,setZoom] = useState(false);
  const [pos,setPos] = useState({x:50,y:50});
  const [light,setLight] = useState(false);
  const onMove = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    setPos({ x:((e.clientX-r.left)/r.width)*100, y:((e.clientY-r.top)/r.height)*100 });
  };
  return (
    <React.Fragment>
      <div className="main zoomable"
        onMouseEnter={()=>setZoom(true)} onMouseLeave={()=>setZoom(false)}
        onMouseMove={onMove} onClick={()=>setLight(true)}>
        <img src={src} alt={alt}
          style={{transform: zoom?"scale(2.3)":"scale(1)", transformOrigin: pos.x+"% "+pos.y+"%"}}/>
        <button className="pd-zoom-btn" aria-label="Enlarge image"
          onClick={(e)=>{e.stopPropagation(); setLight(true);}}><I.search width="19" height="19"/></button>
      </div>
      {light && <div className="pd-lightbox" onClick={()=>setLight(false)}>
        <img src={src} alt={alt}/>
        <button className="pd-lb-close" aria-label="Close"><I.x width="26" height="26"/></button>
      </div>}
    </React.Fragment>
  );
}
function Detail({ p }) {
  const gal = (p.gallery&&p.gallery.length) ? p.gallery : null;
  const [sel,setSel] = useState(0);
  const cat = CATS[p.cat] || {label:"Parts",page:"space-ray-parts.html"};
  const quoteHref = "contact.html?part="+encodeURIComponent(p.pn||p.nm);
  const title = p.pn || p.nm;
  const related = (p.related||[]).map(r=>({...r, part:(window.SR_PARTS||[]).find(x=>x.id===r.id)})).filter(r=>r.part);
  return (
    <React.Fragment>
      <div className="wrap crumb"><a href="index.html">Home</a><I.chevR width="14" height="14"/><a href="parts.html">Parts</a><I.chevR width="14" height="14"/><a href="space-ray-parts.html">Space Ray</a><I.chevR width="14" height="14"/><a href={cat.page}>{cat.label}</a><I.chevR width="14" height="14"/><span>{title}</span></div>
      <section className="wrap section" style={{paddingTop:"6px"}}>
        <div className="pd-wrap">
          <div className="pd-gallery">
            {gal ? <ZoomMain src={A+"/products/"+gal[sel]} alt={title}/> : <div className="main"><span style={{color:"#9aa6b0",fontStyle:"italic"}}>Image coming soon</span></div>}
            {gal && gal.length>1 && <div className="pd-thumbs">{gal.map((g,i)=>(
              <button key={i} className={i===sel?"on":""} onClick={()=>setSel(i)}><img src={A+"/products/"+g} alt=""/></button>
            ))}</div>}
          </div>
          <div className="pd-info">
            <div className="eyebrow">Space Ray · {cat.label}</div>
            <div className="pd-pn">{title}</div>
            <p className="pd-nm">{p.pn ? p.nm : "Request part number"}</p>
            <div className="pd-quote-box">
              <div className="lbl">Price</div>
              <div className="price">Request a Quote</div>
              <a className="btn btn-red btn-lg" href={quoteHref} style={{width:"100%",justifyContent:"center"}}>Get a Quote</a>
            </div>
            {p.note && <div className="pd-note" dangerouslySetInnerHTML={{__html:p.note}}/>}
            <div className="pd-spec">
              {p.pn && <div className="row"><span className="k">Part #</span><span className="v"><b>{p.pn}</b></span></div>}
              <div className="row"><span className="k">Description</span><span className="v">{p.nm}</span></div>
              <div className="row"><span className="k">Brand</span><span className="v">Space-Ray</span></div>
              <div className="row"><span className="k">Compatible</span><span className="v">{p.models&&p.models.length ? "Commonly used on "+p.models.join(", ") : "Used across the Space Ray "+cat.label.toLowerCase().replace(" parts","")+" line"} — <span style={{color:"var(--fg-3,#7a8794)"}}>confirm exact model &amp; serial</span></span></div>
            </div>
            {related.length>0 && <div className="pd-related">
              <h3>{related.length>1?"Related parts":"Related part"}</h3>
              {related.map((r,i)=>(
                <a className="pd-rel-card" key={i} href={"part-detail.html?pn="+r.part.id} style={{marginBottom:i<related.length-1?"10px":"0"}}>
                  <span className="rim">{r.part.gallery&&r.part.gallery[0] ? <img src={A+"/products/"+r.part.gallery[0]} alt={r.part.pn}/> : null}</span>
                  <span className="rtx"><span className="rpn">{r.part.pn}</span><span className="rnm">{r.note||r.part.nm}</span></span>
                  <span className="rgo">View <I.chevR width="14" height="14"/></span>
                </a>
              ))}
            </div>}
            <a className="pd-back" href={cat.page} style={{marginTop:"20px"}}><I.chevR width="15" height="15" style={{transform:"rotate(180deg)"}}/> All {cat.label.toLowerCase()}</a>
          </div>
        </div>
        <div className="pd-heater">
          <div className="him">{p.heaterImg ? <img src={A+"/products/"+p.heaterImg} alt={p.heaterName}/> : null}</div>
          <div className="htx">
            <div className="eyebrow" style={{color:"var(--prp-red)",fontWeight:800,textTransform:"uppercase",letterSpacing:".05em",fontSize:"12.5px"}}>Goes in</div>
            <h3>{p.heaterName}</h3>
            <p>This part is used in the {p.heaterName}{p.models&&p.models.length?" (and related "+p.models.join(", ")+" models)":""}. Heater shown is representative — confirm your exact model and serial number before ordering, and we’ll match the right part.</p>
            <div style={{marginTop:"14px"}}><a className="btn btn-outline btn-sm" href={quoteHref}>Get a Quote</a></div>
          </div>
        </div>
      </section>
    </React.Fragment>
  );
}
function App() {
  return (<React.Fragment><Header active="Parts" />{P ? <Detail p={P} /> : <NotFound/>}<Footer /></React.Fragment>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
