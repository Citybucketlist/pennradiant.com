<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space-Ray Ceramic Heater — Penn Radiant</title>
<meta name="description" content="Space-Ray high-intensity infrared ceramic radiant heater detail from Penn Radiant — DK &amp; RSCA models, full specifications, BTU lineup and a fast quote.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://www.pennradiant.com/ceramic-heater.html">
<meta property="og:type" content="product">
<meta property="og:site_name" content="Penn Radiant Products">
<meta property="og:image" content="https://www.pennradiant.com/assets/headers/parts.jpg">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="styles.css?v=68">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <link rel="shortcut icon" href="favicon.ico">
<script src="ceramic-data.js?v=3"></script>
<style>
.pd-wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:38px;align-items:start}
@media(max-width:820px){.pd-wrap{grid-template-columns:1fr;gap:22px}}
.pd-photo{position:relative;background:#fff;border:1px solid var(--prp-gray-150);border-radius:14px;display:flex;align-items:center;justify-content:center;padding:26px 26px 70px;min-height:380px}
.pd-photo img.heater{max-width:100%;max-height:400px;object-fit:contain}
.pd-photo .brandlogo{position:absolute;left:22px;bottom:20px;max-width:150px;max-height:38px;object-fit:contain}
.pd-info .eyebrow{color:var(--prp-red);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:12.5px}
.pd-pn{font-size:32px;font-weight:900;letter-spacing:.01em;color:var(--prp-ink);margin:5px 0 2px}
.pd-sub{font-size:15px;color:var(--fg-2,#4a5568);margin:0 0 8px}
.pd-btu{font-size:20px;font-weight:800;color:var(--prp-ink);margin:0 0 16px}
.pd-blurb{font-size:14.5px;color:var(--fg-2,#4a5568);line-height:1.55;margin:0 0 16px}
.pd-quote-box{border:1px solid var(--prp-gray-150);border-radius:12px;padding:16px 18px;background:var(--prp-gray-100,#f7f8f9)}
.pd-quote-box .lbl{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-3,#7a8794);font-weight:800}
.pd-quote-box .price{font-size:18px;font-weight:900;color:var(--prp-ink);margin:2px 0 12px}
.pd-cols{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:26px}
@media(max-width:760px){.pd-cols{grid-template-columns:1fr;gap:22px}}
.pd-spec h3,.pd-models h3,.pd-feats h3{font-size:16px;margin:0 0 10px}
.pd-spec .row{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--prp-gray-100,#eee);font-size:14px}
.pd-spec .k{flex:0 0 120px;color:var(--fg-3,#7a8794);font-weight:700}
.pd-spec .v{color:var(--prp-ink)}
.mtable{width:100%;border-collapse:collapse;font-size:14px}
.mtable th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-3,#7a8794);border-bottom:2px solid var(--prp-gray-150);padding:0 10px 7px 0}
.mtable td{padding:8px 10px 8px 0;border-bottom:1px solid var(--prp-gray-100,#eee)}
.mtable td:first-child{font-weight:800;color:var(--prp-ink)}
.mnote{font-size:12.5px;color:var(--fg-3,#7a8794);margin-top:10px;line-height:1.5}
.pd-feats{margin-top:30px}
.pd-feats ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 26px}
@media(max-width:680px){.pd-feats ul{grid-template-columns:1fr}}
.pd-feats li{position:relative;padding-left:22px;font-size:14px;color:var(--fg-2,#4a5568);line-height:1.45}
.pd-feats li i{position:absolute;left:0;top:1px;color:var(--prp-red);font-style:normal;font-weight:900}
.pd-back{display:inline-flex;align-items:center;gap:5px;color:var(--prp-red);font-weight:700;text-decoration:none;font-size:14px;margin-top:6px}
.pd-parts{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;border:1px solid var(--prp-gray-150);border-left:4px solid var(--prp-red);border-radius:12px;background:var(--prp-gray-100,#f7f8f9);padding:16px 20px;margin-top:26px}
.pd-parts .m{display:flex;flex-direction:column;gap:3px;flex:1;min-width:250px}
.pd-parts .eb{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--prp-red)}
.pd-parts b{font-size:15.5px;color:var(--prp-ink)}
.pd-parts .sub{font-size:13.5px;color:var(--fg-2,#4a5568);line-height:1.45}
.pd-parts .btn{flex:none}
.dk-gal{margin-top:34px}
.dk-gal h3{font-size:18px;margin:0 0 5px}
.dk-gal .intro{font-size:14px;color:var(--fg-2,#4a5568);line-height:1.55;max-width:780px;margin:0 0 18px}
.dk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:900px){.dk-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.dk-grid{grid-template-columns:1fr}}
.dk-card{border:1px solid var(--prp-gray-150);border-radius:14px;background:#fff;padding:14px 14px 12px;display:flex;flex-direction:column;transition:box-shadow .15s,border-color .15s}
.dk-card:hover{border-color:var(--prp-gray-300);box-shadow:0 6px 18px rgba(0,0,0,.07)}
.dk-card .imgwrap{height:190px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:12px}
.dk-card .imgwrap img{max-width:100%;max-height:190px;object-fit:contain}
.dk-card .m{font-weight:900;font-size:16px;color:var(--prp-ink);line-height:1.1}
.dk-card .b{font-size:12.5px;color:var(--prp-red);font-weight:800;margin-top:2px}
.dk-details{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media(max-width:680px){.dk-details{grid-template-columns:1fr}}
.dk-detail{border:1px solid var(--prp-gray-150);border-radius:14px;overflow:hidden;background:#fff}
.dk-detail img{width:100%;height:240px;object-fit:cover;display:block}
.dk-detail .cap{padding:12px 15px}
.dk-detail .cap b{display:block;font-size:14.5px;color:var(--prp-ink)}
.dk-detail .cap span{font-size:12.5px;color:var(--fg-3,#7a8794);line-height:1.4}
.pd-install-sec{margin-top:34px}
.pd-install-sec h3{font-size:18px;margin:0 0 12px}
.pd-install{margin:0}
.pd-install img{width:100%;border-radius:14px;border:1px solid var(--prp-gray-150);display:block}
.pd-install figcaption{font-size:12.5px;color:var(--fg-3,#7a8794);margin-top:9px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="site.jsx?v=26"></script>
<script type="text/babel">
const A = PRP_A, I = PRP_I;
const PARAMS = new URLSearchParams(window.location.search);
const H = (window.CERAMIC_HEATERS||[]).find(x=>x.slug===PARAMS.get("m"));
function NotFound(){
  return (<div className="wrap section" style={{textAlign:"center"}}>
    <h1>Heater not found</h1><p><a href="ceramic-heaters.html">Browse ceramic heaters →</a></p></div>);
}
function Detail({ h }){
  const quoteHref="contact.html?product="+encodeURIComponent("Space-Ray "+h.name);
  return (
    <React.Fragment>
      <div className="wrap crumb"><a href="index.html">Home</a><I.chevR width="14" height="14"/><a href="gas-heating.html">Gas Heating</a><I.chevR width="14" height="14"/><a href="ceramic-heaters.html">Ceramic Heaters</a><I.chevR width="14" height="14"/><span>{h.name}</span></div>
      <section className="wrap section" style={{paddingTop:"6px"}}>
        <div className="pd-wrap">
          <div className="pd-photo">
            <img className="heater" src={A+"/products/ceramic/"+h.img+"?v=3"} alt={"Space-Ray "+h.name}/>
            <img className="brandlogo" src={A+"/brands/"+h.brandLogo} alt={h.brand}/>
          </div>
          <div className="pd-info">
            <div className="eyebrow">{h.brand} · Infrared Ceramic Heater</div>
            <div className="pd-pn">{h.name}</div>
            <div className="pd-sub">{h.sub}</div>
            <div className="pd-btu">{h.btu}</div>
            <p className="pd-blurb">{h.blurb}</p>
            <div className="pd-quote-box">
              <div className="lbl">Pricing</div>
              <div className="price">Request a Quote</div>
              <a className="btn btn-red btn-lg" href={quoteHref} style={{width:"100%",justifyContent:"center"}}>Request a Quote</a>
            </div>
          </div>
        </div>
        {h.gallery && <div className="dk-gal">
          <h3>Models &amp; sizes</h3>
          <p className="intro">{h.gallery.intro}</p>
          <div className="dk-grid">
            {h.gallery.models.map((m,i)=>(
              <div className="dk-card" key={i}>
                <div className="imgwrap"><img src={A+"/products/ceramic/"+m.img+"?v=1"} alt={"Space-Ray "+m.model+" ceramic heater"} loading="lazy"/></div>
                <div className="m">{m.model}</div>
                <div className="b">{m.btu}</div>
              </div>
            ))}
          </div>
          {h.gallery.details && <div className="dk-details">
            {h.gallery.details.map((d,i)=>(
              <figure className="dk-detail" key={i} style={{margin:0}}>
                <img src={A+"/products/ceramic/"+d.img+"?v=1"} alt={d.cap} loading="lazy"/>
                <figcaption className="cap"><b>{d.cap}</b><span>{d.sub}</span></figcaption>
              </figure>
            ))}
          </div>}
        </div>}
        {h.install && <div className="pd-install-sec">
          <h3>In the field</h3>
          <figure className="pd-install" style={{margin:0}}>
            <img src={A+"/products/ceramic/"+h.install.img+"?v=1"} alt={h.install.cap} loading="lazy"/>
            {h.install.cap && <figcaption>{h.install.cap}</figcaption>}
          </figure>
        </div>}
        <div className="pd-cols">
          <div className="pd-models">
            <h3>Model lineup</h3>
            <table className="mtable">
              <thead><tr>{h.modelHead.map((c,i)=><th key={i}>{c}</th>)}</tr></thead>
              <tbody>{h.models.map((r,i)=>(<tr key={i}>{r.map((c,j)=><td key={j}>{c}</td>)}</tr>))}</tbody>
            </table>
            {h.note && <div className="mnote">{h.note}</div>}
          </div>
          <div className="pd-spec">
            <h3>Specifications</h3>
            {h.specs.map((r,i)=>(<div className="row" key={i}><span className="k">{r[0]}</span><span className="v">{r[1]}</span></div>))}
          </div>
        </div>
        {h.feats&&h.feats.length>0 && <div className="pd-feats">
          <h3>Features</h3>
          <ul>{h.feats.map((f,i)=>(<li key={i}><i>▸</i>{f}</li>))}</ul>
        </div>}
        <div className="pd-parts">
          <div className="m">
            <span className="eb">Genuine Factory Parts</span>
            <b>Replacement parts are available for this heater.</b>
            <span className="sub">Burners, controls, motors, electrodes, igniters &amp; more — stocked and quoted by application.</span>
          </div>
          {"space-ray-ceramic-parts.html"
            ? <a className="btn btn-red" href={"space-ray-ceramic-parts.html"}>View parts <I.chevR width="15" height="15"/></a>
            : <a className="btn btn-red" href={"contact.html?part="+encodeURIComponent(h.name||h.model||"heater")}>Contact us about parts <I.chevR width="15" height="15"/></a>}
        </div>
        <div style={{marginTop:"24px",display:"flex",gap:"18px",flexWrap:"wrap",alignItems:"center"}}>
          <a className="pd-back" href="ceramic-heaters.html"><I.chevR width="15" height="15" style={{transform:"rotate(180deg)"}}/> All ceramic heaters</a>
          <a className="pd-back" href={h.cat} target="_blank" rel="noreferrer">View on catalog <I.chevR width="14" height="14"/></a>
        </div>
      </section>
    </React.Fragment>
  );
}
function App(){
  return (<React.Fragment><Header active="Gas Heating" />{H ? <Detail h={H}/> : <NotFound/>}<Footer /></React.Fragment>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
