          <p className="upd">Last modified: September 15, 2015</p>
          <p>Pennsylvania Radiant Products Inc. (dba <b>Penn Radiant</b>) respects your privacy and our site visitors' information. We do not sell or rent to third parties any of the information collected via this website.</p>
          <h2>Information Collected</h2>
          <p>If you request or submit information to us by sending an email or by filling out a "contact" form, we may save your email address as well as any other information you provide on website forms submitted to us. This information may be used to contact you in the future by mail, email, or phone to convey information about our products, services or solutions that we feel may benefit you.</p>

          <p>This notice addresses only www.pennradiant.com's website policy, and does not apply to sites that users access via links from our site. Penn Radiant is not responsible for the information collecting policies of other sites, for the practices employed by websites linked to or from our website, or for the information or content contained therein. Often, links to other websites are provided solely on the basis that they may contain useful information for our website visitors. Users are advised to review the privacy policies of these other websites.</p>
          <h2>Cookies</h2>
          <p>This website may set cookies on your computer. A cookie is a text file that is placed on your computer by our web server and helps recall your use of this website. Cookies are uniquely generated and assigned to you. We may also use one or more 3rd party tracking tools that utilize data collected to track and examine the use of www.pennradiant.com and to prepare reports regarding our website's usage. These 3rd party tracking tools do not collect personally identifiable information.</p>
          <h2>Other Information We Collect</h2>
          <p>Penn Radiant may keep track of technical information about your computer or mobile device, such as the browser type and version, browser plug-in types and versions and operating system of your computer; the Internet Service Provider (ISP) or other provider you use to access this website; and your internet protocol (IP) address, location and time zone setting. To help us understand the use of this website by users, improve your site experience and aid us in marketing and managing this website and our services, we may also collect information as to how you were directed to this website, how you navigate around it, and which external websites or links you access from this website. This information may be shared with our affiliates, suppliers, providers and/or their and our respective agents and contractors.</p>
          <h2>Updating, Correcting, and Deleting Personal Information</h2>
          <p>If you would like to have your personal information updated, corrected or removed from our records, please send an email with "Update/Correct or Remove personal information" in the subject line to <a href="mailto:customerservice@pennradiant.com">customerservice@pennradiant.com</a>.</p>
          <h2>Opting Out of Email</h2>
          <p>You can choose to opt out of receiving email from Penn Radiant at any time. Every email sent from Penn Radiant will include appropriate unsubscribe instructions. To opt out of all email marketing messages, send an email to <a href="mailto:customerservice@pennradiant.com">customerservice@pennradiant.com</a> from the address you wish to unsubscribe and state "Unsubscribe me from all Penn Radiant email marketing."</p>
          <h2>Data Security</h2>
          <p>We use judicious precautions to keep user information disclosed to us secure. To prevent unauthorized access, maintain data accuracy and ensure the appropriate use of information, we have put in place commercially reasonable physical, electronic and managerial procedures to safeguard the information we collect. We may disclose information we collect to third parties, under contract to us, as required to operate this website or to perform business functions on our behalf. Once information has been provided to a third party, it is subject to the policies of that third party.</p>
