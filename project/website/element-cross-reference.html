<script type="text/babel">
const { useState } = React;
const A = PRP_A, I = PRP_I;
const Q0 = (new URLSearchParams(window.location.search).get("q")||"").trim();
const collapse = s => (s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const X = window.ELEMENT_XREF || [];
const BRANDS = window.ELEMENT_XREF_BRANDS || [];

function matches(r,q){
  const qc=collapse(q); if(!qc) return true;
  if(collapse(r.our).includes(qc)) return true;
  if((r.heaters||[]).some(h=>collapse(h).includes(qc))) return true;
  return (r.refs||[]).some(f=>collapse(f.brand).includes(qc)
    || (f.nums||[]).some(n=>collapse(n).includes(qc)) || (f.upc&&collapse(f.upc).includes(qc)));
}
const brandRows = key => X.filter(r=>(r.refs||[]).some(f=>f.brand===key));

function Nums({f}){
  return (
    <div className="xr-alts">
      {(f.nums||[]).map((n,j)=><span className="xr-alt" key={j}>{n}</span>)}
      {f.upc && <span className="xr-alt"><small>UPC</small>&nbsp;{f.upc}</span>}
      {f.pcn && <span className="xr-alt"><small>PCN</small>&nbsp;{f.pcn}</span>}
      {f.equiv && <span className="xr-equiv">electrical equiv · confirm fit</span>}
    </div>
  );
}
function MasterRow({r}){
  return (
    <tr>
      <td><a className="ourpn" href={r.ourHref}>{r.our}</a><div className="xr-ob">{r.ourBrand}</div></td>
      <td className="xr-wv">{r.wv}</td>
      <td className="xr-fits"><div className="xr-alts">{(r.heaters||[]).map((h,i)=><span className="xr-alt hm" key={i}>{h}</span>)}</div></td>
      <td style={{minWidth:"280px"}}>{(r.refs||[]).map((f,i)=>(
        <div className="xr-refline" key={i}><span className="xr-brand">{f.brand}</span><Nums f={f}/></div>
      ))}</td>
    </tr>
  );
}

function App(){
  const [q,setQ]=useState(Q0);
  const shown = X.filter(r=>matches(r,q));
  const totalNums = X.reduce((s,r)=>s+(r.refs||[]).reduce((a,f)=>a+(f.nums||[]).length+(f.upc?1:0),0),0);
  return (
    <React.Fragment>
      <Header active="Parts" />
      <div className="pagehero light"><div className="wrap">
        <div className="eyebrow">Parts · Interchange Guide</div>
        <h1>Replacement Element Cross-Reference</h1>
        <p style={{maxWidth:"730px",color:"var(--fg-2,#4a5568)",fontSize:"15.5px",lineHeight:1.55,margin:"8px 0 16px"}}>
          Have an old, discontinued, or another brand&rsquo;s heating element? Type any part number, OEM
          number, UPC or heater model below &mdash; Fostoria&nbsp;/&nbsp;TPI, Chromalox, Spectrum&nbsp;/&nbsp;Comfort
          and more &mdash; and we&rsquo;ll show you the element we ship as the direct replacement.
        </p>
        <div className="xr-box">
          <div className="fld">
            <I.search width="18" height="18" style={{color:"var(--prp-gray-500)",flex:"none"}}/>
            <input value={q} placeholder="Part #, OEM #, UPC or heater model — e.g. 641-35661, 04877702, CH-624, UTUA-424LT…" autoFocus
                   onChange={e=>setQ(e.target.value)}/>
          </div>
        </div>
        <div className="xr-brandnav">{BRANDS.map(b=><a key={b.slug} href={"#"+b.slug}>{b.key}</a>)}</div>
      </div></div>
      <div className="wrap crumb"><a href="index.html">Home</a><I.chevR width="14" height="14"/><a href="parts.html">Parts</a><I.chevR width="14" height="14"/><span>Element Cross-Reference</span></div>

      <section className="wrap section" style={{paddingTop:"8px"}}>
        <p className="xr-count"><b>{shown.length}</b> of {X.length} elements{q ? <React.Fragment> matching &ldquo;{q}&rdquo;</React.Fragment> : null} &middot; <b>{totalNums}</b> legacy numbers cross-referenced.</p>
        {shown.length
          ? <div className="xr-wrap"><table className="xr-table">
              <thead><tr><th>Our Element</th><th>Watts / Volts</th><th>Fits Heater Models</th><th>Also Replaces (by brand)</th></tr></thead>
              <tbody>{shown.map((r,i)=><MasterRow r={r} key={i}/>)}</tbody>
            </table></div>
          : <div className="xr-empty">
              <h3>No match for &ldquo;{q}&rdquo; yet</h3>
              <p>We couldn&rsquo;t match that number in our published interchange &mdash; but we very likely
                 stock the element. Send it to our parts team and we&rsquo;ll identify it from your heater&rsquo;s model &amp; serial.</p>
              <div style={{display:"flex",gap:"12px",flexWrap:"wrap"}}>
                <a className="btn btn-red" href={"contact.html?part="+encodeURIComponent(q)}>Request this element</a>
                <a className="btn btn-outline" href="aitken-elements.html">Browse all elements</a>
              </div>
            </div>}
      </section>

      {BRANDS.map(b=>{ const rows=brandRows(b.key); return (
        <section className="wrap section" style={{paddingTop:"0"}} id={b.slug} key={b.slug}>
          <div className="xr-secthead"><h2><span className="lt">{b.key}</span> element replacements</h2></div>
          <p className="xr-blurb" dangerouslySetInnerHTML={{__html:b.blurb}}/>
          {b.heaters && b.heaters.length ? (
            <React.Fragment>
              <p className="xr-heatlbl">Heaters these elements fit &mdash; for reference</p>
              <div className="xr-heaters">
                {b.heaters.map((h,i)=>(
                  <figure className="xr-heater" key={i}>
                    <span className="ph"><img src={A+"/products/elements/"+h.img} alt={b.key+" "+h.cap+" heater"} loading="lazy"/></span>
                    <figcaption className="cap">{h.cap}</figcaption>
                    <div className="sub">{h.sub}</div>
                  </figure>
                ))}
              </div>
            </React.Fragment>
          ) : null}
          <div className="xr-wrap"><table className="xr-table">
            <thead><tr><th>{b.key} number(s)</th><th>Fits Models</th><th>Watts / Volts</th><th>Our Replacement</th></tr></thead>
            <tbody>{rows.map((r,i)=>{ const f=(r.refs||[]).find(x=>x.brand===b.key)||{}; return (
              <tr key={i}>
                <td style={{minWidth:"210px"}}><Nums f={f}/></td>
                <td className="xr-fits">{(r.heaters||[]).join(", ")}</td>
                <td className="xr-wv">{r.wv}</td>
                <td><a className="ourpn" href={r.ourHref}>{r.our}</a><div className="xr-ob">{r.ourBrand}</div></td>
              </tr>
            );})}</tbody>
          </table></div>
        </section>
      );})}

      <section className="wrap section" style={{paddingTop:"0"}}>
        <div className="xr-note"><div>
          <p><b>Before you order:</b> a cross-referenced element matches on wattage, voltage, physical
          dimensions and method of installation &mdash; but heater builds vary by year. These are USA-made
          <b> alternate / direct replacements</b>, not OEM-branded parts. Confirm your exact model &amp; serial
          with us and we&rsquo;ll make sure you get the right element the first time. Call <b>1.800.438.2503</b> or
          <a href="contact.html" style={{color:"var(--prp-red)",fontWeight:700}}> request a quote</a>.</p>
        </div></div>
      </section>
      <Footer />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
