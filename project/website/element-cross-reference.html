<script type="text/babel">
const { useState } = React;
const A = PRP_A, I = PRP_I;
const Q0 = (new URLSearchParams(window.location.search).get("q")||"").trim();

const u = (v,suf) => v ? (/[A-Za-z]$/.test(v)?v:v+suf) : "";
const collapse = s => (s||"").toLowerCase().replace(/[^a-z0-9]/g,"");

/* One row per part we sell. `alts` = every other number that lands here —
   other brands' current numbers AND their superseded (old) numbers. */
function buildRows(){
  const out=[];
  (window.AITKEN_PARTS||[]).forEach(p=>{
    const s=p.specs||{};
    const alts=[];
    (p.xref||[]).forEach(x=>{
      if(x.pn)  alts.push({brand:x.brand, pn:x.pn});
      if(x.old) alts.push({brand:x.brand, pn:x.old, old:true});
    });
    out.push({
      ourPn:p.pn, brand:"Aitken",
      wv:[u(s.watts,"W"), u(s.volts,"V")].filter(Boolean).join(" / "),
      type:s.type||"", fits:s.fits||"", alts,
      href:"aitken-element.html?pn="+encodeURIComponent(p.pn),
    });
  });
  (window.FOSTORIA_PARTS||[]).forEach(p=>{
    const alts=[];
    if(p.old) alts.push({brand:"Fostoria / TPI", pn:p.old, old:true});
    (p.xref||[]).forEach(x=>{ if(x.pn) alts.push({brand:x.brand, pn:x.pn}); });
    out.push({
      ourPn:p.former, brand:"Fostoria / TPI",
      wv:[p.watts,p.volts].filter(Boolean).join(" / "),
      type:p.type||"", fits:p.fits||"", alts,
      href:"fostoria-element.html?pn="+encodeURIComponent(p.id),
    });
  });
  return out;
}
const ROWS = buildRows();

function matches(r, q){
  if(!q) return true;
  const qc = collapse(q);
  if(!qc) return true;
  if(collapse(r.ourPn).includes(qc)) return true;
  if(r.alts.some(a=>collapse(a.pn).includes(qc))) return true;
  const text = collapse(r.brand+r.type+r.fits+r.wv);
  return text.includes(qc);
}

function Row({r}){
  return (
    <tr>
      <td><a className="ourpn" href={r.href}>{r.ourPn}</a></td>
      <td><span className="xr-brand">{r.brand}</span></td>
      <td className="xr-wv">{r.wv||"—"}</td>
      <td>{r.type||"—"}</td>
      <td className="xr-fits">{r.fits || <span className="xr-none">—</span>}</td>
      <td>
        {r.alts.length
          ? <div className="xr-alts">{r.alts.map((a,i)=>(
              <span className="xr-alt" key={i}>{a.pn}{a.old && <small>old #</small>}</span>
            ))}</div>
          : <span className="xr-none">Cross-reference pending</span>}
      </td>
    </tr>
  );
}

function App(){
  const [q,setQ] = useState(Q0);
  const shown = ROWS.filter(r=>matches(r,q));
  const withAlts = ROWS.filter(r=>r.alts.length).length;
  return (
    <React.Fragment>
      <Header active="Parts" />
      <div className="pagehero light"><div className="wrap">
        <div className="eyebrow">Parts · Interchange Guide</div>
        <h1>Heating Element Cross-Reference</h1>
        <p style={{maxWidth:"680px",color:"var(--fg-2,#4a5568)",fontSize:"15.5px",lineHeight:1.55,margin:"8px 0 16px"}}>
          Have a part number off an old element or a heater manual? Type it below — current
          number or superseded &ldquo;old&rdquo; number, any brand — and we&rsquo;ll show you the
          element we ship as its direct replacement.
        </p>
        <div className="xr-box">
          <div className="fld">
            <I.search width="18" height="18" style={{color:"var(--prp-gray-500)",flex:"none"}}/>
            <input value={q} placeholder="Element part # — e.g. 641-35661, 642-21004, HE20240…" autoFocus
                   onChange={e=>setQ(e.target.value)}/>
          </div>
        </div>
      </div></div>
      <div className="wrap crumb"><a href="index.html">Home</a><I.chevR width="14" height="14"/><a href="parts.html">Parts</a><I.chevR width="14" height="14"/><span>Element Cross-Reference</span></div>

      <section className="wrap section" style={{paddingTop:"8px"}}>
        <p className="xr-count">
          <b>{shown.length}</b> of {ROWS.length} elements{q ? <React.Fragment> matching &ldquo;{q}&rdquo;</React.Fragment> : null}.
        </p>
        {shown.length
          ? <React.Fragment>
              <div className="xr-wrap">
                <table className="xr-table">
                  <thead><tr>
                    <th>Our Part #</th><th>Brand</th><th>Watts / Volts</th>
                    <th>Type</th><th>Fits Models</th><th>Also Replaces</th>
                  </tr></thead>
                  <tbody>{shown.map((r,i)=><Row r={r} key={i}/>)}</tbody>
                </table>
              </div>
              <p className="xr-legend" style={{marginTop:"12px"}}>
                Cross-reference covers {withAlts} of {ROWS.length} elements today. We&rsquo;re actively
                adding manufacturer manuals and additional brands — if your number isn&rsquo;t listed, we still very likely stock it.
              </p>
            </React.Fragment>
          : <div className="xr-empty">
              <h3>No match for &ldquo;{q}&rdquo; yet</h3>
              <p>We couldn&rsquo;t match that number in our published interchange &mdash; but we very likely
                 stock the element. Send it to our parts team and we&rsquo;ll identify it from your heater&rsquo;s model &amp; serial.</p>
              <div style={{display:"flex",gap:"12px",flexWrap:"wrap"}}>
                <a className="btn btn-red" href={"contact.html?part="+encodeURIComponent(q)}>Request this element</a>
                <a className="btn btn-outline" href="aitken-elements.html">Browse all elements</a>
              </div>
            </div>}

        <div className="xr-note">
          <div>
            <p><b>Before you order:</b> a cross-referenced element matches on wattage, voltage, physical
            dimensions and method of installation &mdash; but heater builds vary by year. Confirm your exact
            model and serial number with us and we&rsquo;ll make sure you get the right element the first time.
            Call <b>1.800.438.2503</b> or <a href="contact.html" style={{color:"var(--prp-red)",fontWeight:700}}>request a quote</a>.</p>
          </div>
        </div>
      </section>
      <Footer />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
