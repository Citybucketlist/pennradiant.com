<style>
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.rcard{display:flex;flex-direction:column;border:1px solid var(--prp-gray-150);border-radius:12px;overflow:hidden;background:#fff}
.rcard .ph{height:170px;background:#fff;border-bottom:1px solid var(--prp-gray-100,#f3f4f6);display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden}
.rcard .ph img{max-width:100%;max-height:100%;object-fit:contain}
.rcard .body{padding:14px 15px 15px;display:flex;flex-direction:column;flex:1}
.rcard .brand{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--prp-red)}
.rcard .nm{font-weight:900;font-size:16.5px;letter-spacing:.01em;margin-top:2px;line-height:1.2}
.rcard .pn{font-size:11.5px;color:var(--fg-3,#7a8794);margin-top:2px}
.rcard .spec{font-size:13.5px;font-weight:800;color:var(--prp-ink);margin-top:9px}
.rcard ul{list-style:none;padding:0;margin:9px 0 0}
.rcard li{position:relative;padding-left:16px;font-size:12.8px;color:var(--fg-2,#4a5568);line-height:1.45;margin-bottom:3px}
.rcard li i{position:absolute;left:0;top:0;color:var(--prp-red);font-style:normal;font-weight:900}
.rcard .q{margin-top:auto;padding-top:12px}
.rcard .q a{font-size:12.5px;font-weight:800;color:var(--prp-red);display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.rhero{background:linear-gradient(180deg,var(--prp-gray-100,#f6f7f9),#fff);border-bottom:1px solid var(--prp-gray-100,#eef0f2)}
.rhero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center;padding:40px 0 30px}
@media(max-width:820px){.rhero .wrap{grid-template-columns:1fr;gap:16px;padding:30px 0 22px}}
.rhero .eyebrow{color:var(--prp-red);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:12.5px}
.rhero h1{font-size:38px;line-height:1.05;margin:8px 0 12px}
.rhero p{color:var(--fg-2,#4a5568);font-size:15.5px;line-height:1.55;max-width:540px}
.rhero .pic img{max-width:100%;display:block}

<body>
<div id="root"></div>
<script type="text/babel" src="site.jsx?v=25"></script>
<script type="text/babel">
const A = PRP_A, I = PRP_I;
const REG = window.GAS_REGULATORS || {standard:[],highPressure:[]};
function Card({ r }) {
  const quoteHref = "contact.html?product="+encodeURIComponent("Gas Regulator "+r.name);
  return (
    <div className="rcard">
      <div className="ph"><img src={A+"/products/regulators/"+r.img} alt={r.name}/></div>
      <div className="body">
        <div className="brand">{r.brand}</div>
        <div className="nm">{r.name}</div>
        {r.pn && <div className="pn">{/^[0-9]/.test(r.pn)?"SR # ":""}{r.pn}</div>}
        <div className="spec">{r.spec}</div>
        <ul>{r.uses.map((u,i)=>(<li key={i}><i>▸</i>{u}</li>))}</ul>
        <div className="q"><a href={quoteHref}>Request a Quote <I.chevR width="13" height="13"/></a></div>
      </div>
    </div>
  );
}
function App() {
  return (
    <React.Fragment>
      <Header active="Gas Heating" />
      <section className="rhero"><div className="wrap">
        <div>
          <div className="eyebrow">Gas-Fired Heating · Accessories</div>
          <h1>Gas Regulators</h1>
          <p>The right regulator keeps your heater running safely and efficiently. We stock low- and high-pressure gas regulators — Maxitrol, Fisher, Engineered Controls and Heat&nbsp;Wagon / Sure&nbsp;Flame — for natural gas and propane. Not sure which you need? Send us your heater model and gas supply and we&rsquo;ll match it.</p>
        </div>
        <div className="pic"><img src={A+"/products/regulators/row.png"} alt="Row of gas pressure regulators"/></div>
      </div></section>
      <div className="wrap crumb"><a href="index.html">Home</a><I.chevR width="14" height="14"/><a href="gas-heating.html">Gas Heating</a><I.chevR width="14" height="14"/><span>Gas Regulators</span></div>

      <section className="wrap section" style={{paddingTop:"10px"}}>
        <div className="eyebrow-row"><h2><span className="lt">STANDARD &amp;</span> LOW-PRESSURE</h2></div>
        <p className="rnote">Appliance and second-stage regulators that step gas down to safe operating pressure for tube, ceramic and floor-model heaters.</p>
        <div className="rgrid">{REG.standard.map((r,i)=><Card r={r} key={i}/>)}</div>
      </section>

      <section className="wrap section" style={{paddingTop:"4px"}}>
        <div className="eyebrow-row"><h2><span className="lt">HIGH-</span>PRESSURE</h2></div>
        <p className="rnote">High-pressure regulators for salamander, construction and high-output heaters — including the Space-Ray RFPA series and Heat Wagon / Sure Flame units.</p>
        <div className="rgrid">{REG.highPressure.map((r,i)=><Card r={r} key={i}/>)}</div>
      </section>

      <section className="band">
        <div className="band-shade" style={{background:"var(--prp-ink)"}}></div>
        <div className="wrap band-inner">
          <span className="eb">Not sure which regulator?</span>
          <h2>We&rsquo;ll Match It to Your Heater</h2>
          <ul>
            <li><i className="tri">&#9656;</i>Send your heater model, fuel (NG or propane) &amp; gas supply pressure</li>
            <li><i className="tri">&#9656;</i>Maxitrol, Fisher, Engineered Controls &amp; Heat Wagon / Sure Flame</li>
            <li><i className="tri">&#9656;</i>Fast quotes &amp; nationwide shipping</li>
          </ul>
          <a className="btn btn-red btn-lg" href="contact.html">Request a Quote</a>
        </div>
      </section>
      <Footer />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
