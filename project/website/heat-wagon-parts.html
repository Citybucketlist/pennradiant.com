<style>
.hwf-head p{font-size:14.5px;color:var(--fg-2,#4a5568);margin:4px 0 12px;max-width:720px;line-height:1.5}
.hwf-box{display:flex;align-items:center;gap:9px;border:1px solid var(--prp-gray-300);border-radius:var(--r-md,10px);padding:11px 14px;background:#fff;max-width:640px}

<body>
<div id="root"></div>
<script type="text/babel" src="site.jsx?v=26"></script>
<script type="text/babel">
const { useState } = React;
const I = PRP_I, CAT = PRP_CAT, A = PRP_A;
const HREF = CAT+"/category/all-categories-heat-wagon-factory-heater-parts";
const LOCAL = {
  "1800.jpg":"heat-wagon-1800-parts.html",
  "1800B.jpg":"heat-wagon-1800b-parts.html",
  "950H.jpg":"heat-wagon-950h-parts.html",
  "2000.jpg":"heat-wagon-2000-parts.html",
  "2730C.jpg":"heat-wagon-2730c-parts.html",
  "i36.jpg":"heat-wagon-i36-parts.html",
  "HVF110.jpg":"heat-wagon-hvf110-parts.html",
  "HVF210.jpg":"heat-wagon-hvf210-parts.html",
  "HVF310.jpg":"heat-wagon-hvf310-parts.html",
  "VG400.jpg":"heat-wagon-vg400-parts.html",
  "VG500.jpg":"heat-wagon-vg500-parts.html",
  "VG1000.jpg":"heat-wagon-vg1000-parts.html",
  "VG175.jpg":"heat-wagon-vg175-parts.html",
  "P900.jpg":"heat-wagon-p900-parts.html",
  "P4000-P6000.jpg":"heat-wagon-p4000-p6000-parts.html",
  "DF400.jpg":"heat-wagon-df400-parts.html",
  "DF600.jpg":"heat-wagon-df600-parts.html",
  "DG250.jpg":"heat-wagon-dg250-parts.html",
  "DG400.jpg":"heat-wagon-dg400-parts.html",
  "HVF410HD.jpg":"heat-wagon-hvf410hd-parts.html",
};

// Official Heat Wagon model icons (self-contained tiles) from the brand asset library.
const MODELS = [
  { nm:"Heat Wagon Model 1800 Heater Parts", img:"1800.jpg" },
  { nm:"Heat Wagon Model 1800B Heater Parts", img:"1800B.jpg" },
  { nm:"Heat Wagon Model 950H Heater Parts", img:"950H.jpg" },
  { nm:"Heat Wagon Model 2000 Heater Parts", img:"2000.jpg" },
  { nm:"Heat Wagon Model 2730C Heater Parts", img:"2730C.jpg" },
  { nm:"Heat Wagon Model i36 Fan Parts", img:"i36.jpg" },
  { nm:"Heat Wagon Model HVF110 Heater Parts", img:"HVF110.jpg" },
  { nm:"Heat Wagon Model HVF210 Heater Parts", img:"HVF210.jpg" },
  { nm:"Heat Wagon Model HVF310 Heater Parts", img:"HVF310.jpg" },
  { nm:"Heat Wagon Model HVF410HD Heater Parts", img:"HVF410HD.jpg" },
  { nm:"Heat Wagon Model DF400 Heater Parts", img:"DF400.jpg" },
  { nm:"Heat Wagon Model DF600 Heater Parts", img:"DF600.jpg" },
  { nm:"Heat Wagon Model DG250 Heater Parts", img:"DG250.jpg" },
  { nm:"Heat Wagon Model DG400 Heater Parts", img:"DG400.jpg" },
  { nm:"Heat Wagon Model VG175 Heater Parts", img:"VG175.jpg" },
  { nm:"Heat Wagon Model VG400 Heater Parts", img:"VG400.jpg" },
  { nm:"Heat Wagon Model VG500 Heater Parts", img:"VG500.jpg" },
  { nm:"Heat Wagon Model VG700 Heater Parts", img:"VG700.jpg" },
  { nm:"Heat Wagon Model VG1000 Heater Parts", img:"VG1000.jpg" },
  { nm:"Heat Wagon Model P900 Heater Parts", img:"P900.jpg" },
  { nm:"Heat Wagon Model P4000 & P6000 Heater Parts", img:"P4000-P6000.jpg" },
];

function CatCard({ m }) {
  const href = LOCAL[m.img] || HREF;
  const ext = !LOCAL[m.img];
  return (
    <a className="catcard" href={href} {...(ext?{target:"_blank",rel:"noreferrer"}:{})} aria-label={m.nm} title={m.nm}>
      <img src={A+"/hw-icons/"+m.img} alt={m.nm} loading="lazy"/>
    </a>
  );
}

const HWP = window.HW_PARTS||[];
const hwCollapse = s => (s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const hwMoney = n => "$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
function HWFinder(){
  const [q,setQ]=React.useState("");
  const qc=hwCollapse(q); let res=[];
  if(qc.length>=2){
    res=HWP.map(p=>{const pnc=hwCollapse(p.pn);let s=-1;
      if(pnc===qc)s=0;else if(pnc.startsWith(qc))s=1;else if(pnc.includes(qc))s=2;
      else if((p.nm+" "+(p.desc||"")).toLowerCase().includes(q.toLowerCase()))s=3;
      else if((p.models||[]).some(m=>hwCollapse(m).includes(qc)))s=4;
      return s<0?null:[s,p];}).filter(Boolean).sort((a,b)=>a[0]-b[0]||a[1].pn.localeCompare(b[1].pn)).slice(0,24).map(x=>x[1]);
  }
  return (
    <section className="wrap section" style={{paddingTop:"6px",paddingBottom:"4px"}}>
      <div className="hwf-head"><div className="eyebrow">Find a part by number</div><p>Type a Heat Wagon or Sure Flame part number, a description, or a heater model. Every part shows its 2026-2027 list price and the models it fits.</p></div>
      <div className="hwf-box"><I.search width="18" height="18" style={{color:"var(--prp-gray-500)",flex:"none"}}/><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Part #, description or model, e.g. E10215, electrode, DF400"/></div>
      {qc.length>=2 && (res.length
        ? <div className="hwf-grid">{res.map(p=>(
            <a className="hwf-card" key={p.id} href={"hw-part-detail.html?pn="+encodeURIComponent(p.id)}>
              <div className="ph">{p.gallery&&p.gallery[0]?<img src={A+"/products/"+p.gallery[0]} alt={p.pn}/>:p.context?<img className="ctx" src={A+"/products/"+p.context} alt=""/>:<span>No image</span>}</div>
              <div className="body"><div className="pn">{p.pn}</div><div className="nm">{p.nm}</div>
                <div className="pr">{p.price!=null?<span>List <b>{hwMoney(p.price)}</b></span>:<span className="q">Request a Quote</span>}</div>
                <div className="md">{(p.models||[]).slice(0,4).join(", ")}{(p.models||[]).length>4?" +"+((p.models||[]).length-4)+" more":""}</div></div>
            </a>))}</div>
        : <p className="hwf-none">No match for "{q}" in our published parts. <a href={"contact.html?part="+encodeURIComponent(q)}>Send it to our parts team</a> and we will identify it from your model and serial number.</p>)}
    </section>
  );
}

function App() {
  return (
    <React.Fragment>
      <Header active="Parts" />
      <div className="pagehero light"><div className="wrap">
        <img className="hero-logo" src={A+"/brands/heat-wagon.png"} alt="Heat Wagon"/>
        <div className="eyebrow">Heat Wagon · Factory Replacement Parts</div>
        <h1>Heat Wagon Heater Parts</h1>
        <p>Genuine factory replacement parts for Heat Wagon direct-fired, indirect-fired and ventilation equipment. Browse by model to find burners, motors, controls, igniters and more.</p>
      </div></div>
      <div className="wrap crumb">
        <a href="index.html">Home</a><I.chevR width="14" height="14"/>
        <a href="gas-heating.html">Gas Heating</a><I.chevR width="14" height="14"/>
        <span>Heat Wagon Factory Parts</span>
      </div>
      <HWFinder />

      <section className="wrap section" style={{paddingTop:"6px"}}>
        <div className="catbar">
          <div className="count">Browse by model — {MODELS.length} part categories</div>
          <a className="btn btn-outline btn-sm" href="contact.html">Request Information</a>
        </div>
        <div style={{height:"14px"}}></div>
        <div className="catgrid">
          {MODELS.map((m,i)=><CatCard m={m} key={i}/>)}
        </div>
      </section>

      <section className="band">
        <div className="band-shade" style={{background:"var(--prp-ink)"}}></div>
        <div className="wrap band-inner">
          <span className="eb">Can’t find your model?</span>
          <h2>We’ll Track Down the Part</h2>
          <ul>
            <li><i className="tri">▸</i>Send us your model &amp; serial number — we’ll match the exact part</li>
            <li><i className="tri">▸</i>Decades of Heat Wagon parts experience on staff</li>
            <li><i className="tri">▸</i>Fast quotes &amp; nationwide LTL shipping</li>
          </ul>
          <a className="btn btn-red btn-lg" href="contact.html">Contact a Parts Expert</a>
        </div>
      </section>

      <PartsFinder />
      <Footer />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
