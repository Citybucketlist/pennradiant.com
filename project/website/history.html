          <p>Six decades of industrial heating &amp; cooling — family-run, American-made,<br/>and grounded in expert service.</p>

      <section className="wrap section" style={{paddingTop:"6px"}}>
        <p className="hist-lede">Penn Radiant Products was started in <b>1965 by Del Lieb</b>. Since the beginning, PRP has evolved to offer all types of heating and cooling products — from gas-fired to electric heating equipment to misting fans and portable air-conditioning units.</p>
        <div className="hist-body-single">
          <p>What began as a small family operation grew into a trusted name in commercial and industrial climate equipment. Penn Radiant earned its reputation the hard way — by standing behind rugged products that hold up in the harshest environments, and by knowing the catalog well enough to get customers exactly the right part.</p>
          <p>Today PRP supplies and services equipment from the industry’s leading brands — led by <b>Space-Ray</b> and <b>Heat Wagon</b> — alongside Sure Flame, SunStar, Fostoria, TPI, Aitken, Schaefer and more. From a single replacement electrode to a full railcar thaw-shed system, the mission is the same as it was in 1965: dependable heat, honest advice, and American-built quality.</p>
