.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:16px}

.pgroup-h span{color:var(--prp-red)}

<body>
<div id="root"></div>
<script type="text/babel" src="site.jsx?v=26"></script>
<script type="text/babel">
const A = PRP_A, I = PRP_I;
const ITEMS = (window.SR_PARTS||[]).filter(p=>p.cat==="tube");
const GROUPED = {}, GORDER = [];
ITEMS.forEach(p=>{ if(!GROUPED[p.group]){GROUPED[p.group]=[];GORDER.push(p.group);} GROUPED[p.group].push(p); });
function PartCard({ p }) {
  const img = p.gallery && p.gallery[0];
  const title = p.pn || p.nm;
  return (
    <a className="pcard" href={"part-detail.html?pn="+p.id}>
      {img ? <div className="ph"><img src={A+"/products/"+img} alt={title}/></div>
            : <div className="ph none">Image coming soon</div>}
      <div className="body">
        <div className="pn">{title}</div>
        {p.pn && <div className="nm">{p.nm}</div>}
        <div className="view">View details <I.chevR width="15" height="15"/></div>
      </div>
    </a>
  );
}
function App() {
  return (
    <React.Fragment>
      <Header active="Parts" />
      <div className="pagehero light"><div className="wrap">
        <div className="eyebrow">Space Ray · Infrared Tube Heaters</div>
        <h1>Tube Heater Parts</h1>
        <p>Genuine Space-Ray factory replacement parts for infrared tube heaters — draft inducer motors, blower wheels, gas valve kits, air switches, electrodes, ignition modules, transformers, monitoring lights and more.</p>
      </div></div>
      <div className="wrap crumb"><a href="index.html">Home</a><I.chevR width="14" height="14"/><a href="parts.html">Parts</a><I.chevR width="14" height="14"/><a href="space-ray-parts.html">Space Ray</a><I.chevR width="14" height="14"/><span>Tube Heater Parts</span></div>
      <section className="wrap section" style={{paddingTop:"10px"}}>
        <div className="eyebrow-row"><h2><span className="lt">REPLACEMENT</span> PARTS</h2></div>
        <p className="parts-note">Space Ray parts are quoted by application. Click any part for photos, the heater it’s used in, and to request a quote.</p>
        {GORDER.map((g,gi)=>(<div className="pgroup" key={gi}><h3 className="pgroup-h">{g}<span className="ct">{GROUPED[g].length} parts</span></h3><div className="pgrid">{GROUPED[g].map((p,i)=><PartCard p={p} key={i}/>)}</div></div>))}
      </section>
      <Footer />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
