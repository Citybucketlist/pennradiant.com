<!DOCTYPE html>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="fixed-data.js?v=2"></script>
<style>
.pih-hero{background:linear-gradient(180deg,var(--prp-gray-100,#f6f7f9),#fff);border-bottom:1px solid var(--prp-gray-100,#eef0f2)}
.pih-hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center;padding:38px 0 30px}
@media(max-width:860px){.pih-hero .wrap{grid-template-columns:1fr;gap:16px;padding:28px 0 22px}}
.pih-hero .eyebrow{color:var(--prp-red);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:12.5px}
.pih-hero h1{font-size:38px;line-height:1.05;margin:8px 0 12px}
@media(max-width:860px){.pih-hero h1{font-size:30px}}
.pih-hero p{color:var(--fg-2,#4a5568);font-size:15.5px;line-height:1.55;max-width:560px}
.pih-hero .pic img{max-width:100%;border-radius:14px;display:block}
.pih-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pih-badge{font-size:12.5px;font-weight:800;background:#fff;border:1px solid var(--prp-gray-150);color:var(--prp-ink);padding:7px 13px;border-radius:999px}
.pih-badge b{color:var(--prp-red)}
.pih{display:grid;grid-template-columns:.9fr 1.1fr;gap:36px;align-items:center;padding:8px 0}
.pih.rev{grid-template-columns:1.1fr .9fr}
.pih.rev .pih-pic{display:flex;align-items:center;justify-content:center;padding:8px}
@media(max-width:820px){.pih,.pih.rev{grid-template-columns:1fr;gap:18px}.pih.rev .pih-pic{order:0}}
.pih-pic{background:#fff;border:1px solid var(--prp-gray-150);border-radius:16px;display:flex;align-items:center;justify-content:center;padding:14px}
.pih-pic img{max-width:100%;max-height:340px;object-fit:contain;filter:drop-shadow(0 12px 24px rgba(0,0,0,.13))}
.pih-eyebrow{color:var(--prp-red);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:12px}
.pih h2{font-size:27px;margin:5px 0 4px}
.pih-sub{font-size:13.5px;color:var(--fg-3,#7a8794);font-weight:700;margin:0 0 12px}
.pih-desc{font-size:14.5px;color:var(--fg-2,#4a5568);line-height:1.6;margin:0 0 16px}
.pih-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pih-chip{font-size:12.5px;font-weight:800;background:var(--prp-gray-100,#f1f3f5);color:var(--prp-ink);padding:7px 12px;border-radius:8px}
.pih-chip b{color:var(--prp-red)}
.pih-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:16px}
.pih-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-3,#7a8794);border-bottom:2px solid var(--prp-gray-150);padding:7px 10px 7px 0}
.pih-table td{padding:8px 10px 8px 0;border-bottom:1px solid var(--prp-gray-100,#eee)}
.pih-table td.m{font-weight:800;color:var(--prp-ink)}
.pih-table td.e a{color:var(--prp-blue);font-weight:700;text-decoration:none}
.ss-cell{display:flex;gap:7px;align-items:center}
.ss-ic{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid var(--prp-gray-150);border-radius:7px;background:#fff;color:var(--prp-gray-700,#565659);cursor:pointer;transition:border-color .14s,color .14s}
.ss-ic:hover{border-color:var(--prp-red);color:var(--prp-red)}
.pih-cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pih-price{font-size:13px;color:var(--fg-3,#7a8794);font-weight:700}
.pih-price b{color:var(--prp-ink);font-size:15px}
.pih-hr{border:0;border-top:1px solid var(--prp-gray-150);margin:6px 0}
.pih-parts{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border:1px solid var(--prp-gray-150);border-left:4px solid var(--prp-red);border-radius:14px;background:var(--prp-gray-100,#f7f8f9);padding:16px 22px}
.pih-parts .thumb{flex:none;width:72px;height:72px;background:#fff;border:1px solid var(--prp-gray-150);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:7px}
.pih-parts .thumb img{max-width:100%;max-height:100%;object-fit:contain}
.pih-parts .m{flex:1;min-width:260px;display:flex;flex-direction:column;gap:3px}
.pih-parts .eb{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--prp-red)}
.pih-parts b{font-size:16px;color:var(--prp-ink)}
.pih-parts .sub{font-size:13.5px;color:var(--fg-2,#4a5568);line-height:1.45}
.pih-parts .btn{flex:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="site.jsx?v=26"></script>
<script type="text/babel">
const A = PRP_A, I = PRP_I;
const HEATERS = window.FIXED_HEATERS || [];
const printSpec = (url) => {
  const w = window.open("", "_blank", "width=850,height=1100");
  if(!w){ window.open(url,"_blank"); return; }
  w.document.write('<!doctype html><title>Spec Sheet — Penn Radiant</title><style>@page{margin:.4in}html,body{margin:0}img{width:100%;height:auto;display:block}</style><img src="'+url+'" onload="setTimeout(function(){window.focus();window.print();},200)">');
  w.document.close();
};
const IcPrint = (p)=>(<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>);
const IcDownload = (p)=>(<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>);
const IcEye = (p)=>(<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>);
function Heater({ h, i }){
  const rev = i % 2 === 1;
  const quote = "contact.html?product="+encodeURIComponent("Aitken "+h.series+" "+h.kw+" Overhead Infrared Heater");
  return (
    <React.Fragment>
      {i>0 && <hr className="pih-hr"/>}
      <div className={"pih"+(rev?" rev":"")}>
        <div className="pih-pic"><img src={A+"/products/"+h.img} alt={"Aitken "+h.series+" "+h.kw+" fixed overhead infrared heater"}/></div>
        <div className="pih-body">
          <div className="pih-eyebrow">Aitken · {h.series} Series</div>
          <h2>{h.series} {h.kw} Overhead Infrared</h2>
          <div className="pih-sub">{h.phase} · {h.watts} · 5 voltages (208–600V)</div>
          <p className="pih-desc" dangerouslySetInnerHTML={{__html:h.desc}}/>
          <div className="pih-chips">
            <span className="pih-chip"><b>{h.kw}</b> output</span>
            <span className="pih-chip"><b>{h.btu}</b> BTU/hr</span>
            <span className="pih-chip">{h.phase}</span>
            <span className="pih-chip">American made</span>
          </div>
          <table className="pih-table"><thead>
            <tr><th>Model</th><th>Voltage</th><th>Amps</th><th>Element</th><th>Spec sheet</th></tr>
          </thead><tbody>
            {h.variants.map((v,j)=>(
              <tr key={j}>
                <td className="m">{v.m}</td>
                <td>{v.v}</td>
                <td>{v.a}</td>
                <td className="e"><a href={"aitken-element.html?pn="+encodeURIComponent(v.e)}>{v.e}</a></td>
                <td className="ss"><div className="ss-cell">
                  <a className="ss-ic" title={"View "+v.m+" spec sheet"} href={A+"/products/fixed/spec/"+v.ss+".jpg"} target="_blank" rel="noreferrer"><IcEye/></a>
                  <button className="ss-ic" title={"Print "+v.m+" spec sheet"} onClick={()=>printSpec(A+"/products/fixed/spec/"+v.ss+".jpg")}><IcPrint/></button>
                  <a className="ss-ic" title={"Download "+v.m+" spec sheet (PDF)"} href={A+"/products/fixed/spec/"+v.ss+".pdf"} download={v.m+"-spec-sheet.pdf"}><IcDownload/></a>
                </div></td>
              </tr>
            ))}
          </tbody></table>
          <div className="pih-cta">
            <a className="btn btn-red" href={quote}>Request a Quote</a>
            <span className="pih-price">Net price <b>from ${h.price}</b> · confirm current pricing</span>
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}
function App(){
  return (
    <React.Fragment>
      <Header active="Electric Heating" />
      <section className="pih-hero"><div className="wrap">
        <div>
          <div className="eyebrow">Aitken · Fixed Overhead Electric Infrared</div>
          <h1>Fixed Overhead Infrared Heaters</h1>
          <p>Permanently-mounted electric radiant heat — American made by Aitken. Four output tiers from 2 to 13.5&nbsp;kW, each available in 208 to 600&nbsp;volt, single- or three-phase. Ceiling- or wall-mount infrared for shops, garages, warehouses, entryways and high-bay spaces.</p>
          <div className="pih-badges">
            <span className="pih-badge"><b>2</b> · <b>4.5</b> · <b>6</b> · <b>13.5</b> kW</span>
            <span className="pih-badge">208–600 V</span>
            <span className="pih-badge">1Ø &amp; 3Ø</span>
            <span className="pih-badge">UL · USA made</span>
          </div>
        </div>
        <div className="pic"><img src={A+"/products/fixed/hero.png"} alt="Aitken OH fixed overhead infrared heater — 13.5 kW"/></div>
      </div></section>
      <div className="wrap crumb"><a href="index.html">Home</a><I.chevR width="14" height="14"/><a href="electric-heating.html">Electric Heating</a><I.chevR width="14" height="14"/><span>Fixed Infrared Heaters</span></div>

      <section className="wrap section" style={{paddingTop:"10px"}}>
        <div className="eyebrow-row"><h2><span className="lt">CHOOSE YOUR</span> OUTPUT</h2></div>
        <p className="cnote" style={{fontSize:"13px",color:"var(--fg-3,#7a8794)",margin:"2px 0 20px",maxWidth:"820px",lineHeight:1.55}}>Four output levels, all permanently mounted. Pick the output for your space, then the voltage that matches your power — every model uses genuine Aitken U-rod elements you can replace in the field.</p>
        {HEATERS.map((h,i)=><Heater h={h} i={i} key={i}/>)}
      </section>

      <section className="wrap section" style={{paddingTop:"0"}}>
        <div className="pih-parts">
          <div className="thumb"><img src={A+"/products/aitken/he45208-1.jpg"} alt="Aitken U-rod replacement element"/></div>
          <div className="m">
            <span className="eb">Genuine Factory Parts</span>
            <b>We carry replacement elements for every model.</b>
            <span className="sub">Each Aitken overhead heater uses a field-replaceable U-rod heating element — stocked by wattage &amp; voltage (HE20xxx &amp; HE45xxx). Match your model&rsquo;s element in the table above, or browse them all.</span>
          </div>
          <a className="btn btn-red" href="aitken-elements.html">View replacement elements <I.chevR width="15" height="15"/></a>
        </div>
      </section>

      <section className="band">
        <div className="band-shade" style={{background:"var(--prp-ink)"}}></div>
        <div className="wrap band-inner">
          <span className="eb">Not sure which portable heater?</span>
          <h2>We&rsquo;ll Size It to Your Space</h2>
          <ul>
            <li><i className="tri">&#9656;</i>Tell us your space, ceiling height &amp; available voltage / phase</li>
            <li><i className="tri">&#9656;</i>Aitken OH 2, 4.5, 6 &amp; 13.5 kW overhead · 208–600V</li>
            <li><i className="tri">&#9656;</i>Field-replaceable elements, fast quotes &amp; nationwide shipping</li>
          </ul>
          <a className="btn btn-red btn-lg" href="contact.html">Request a Quote</a>
        </div>
      </section>
      <Footer />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
