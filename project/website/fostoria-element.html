<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fostoria / TPI Element — Penn Radiant</title>
<meta name="description" content="Fostoria / TPI direct replacement metal-sheath U-Rod heating element detail from Penn Radiant — photos, specs, current & old part numbers, and net price.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://www.pennradiant.com/fostoria-element.html">
<meta property="og:type" content="product">
<meta property="og:site_name" content="Penn Radiant Products">
<meta property="og:image" content="https://www.pennradiant.com/assets/headers/elements.jpg">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="styles.css?v=68">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <link rel="shortcut icon" href="favicon.ico">
<script src="fostoria-data.js?v=1"></script>
<style>
.pd-wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:38px;align-items:start}
@media(max-width:820px){.pd-wrap{grid-template-columns:1fr;gap:22px}}
.pd-gallery .main{position:relative;height:380px;background:#fff;border:1px solid var(--prp-gray-150);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:22px;overflow:hidden}
.pd-gallery .main.zoomable{cursor:zoom-in}
.pd-gallery .main img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .18s ease-out}
.pd-zoom-btn{position:absolute;bottom:12px;right:12px;width:42px;height:42px;border-radius:50%;border:1px solid var(--prp-gray-150);background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center;cursor:zoom-in;color:var(--prp-ink);box-shadow:0 2px 8px rgba(0,0,0,.14);z-index:2}
.pd-zoom-btn:hover{color:var(--prp-red);border-color:var(--prp-red)}
.pd-lightbox{position:fixed;inset:0;background:rgba(15,18,22,.9);z-index:9999;display:flex;align-items:center;justify-content:center;padding:34px;cursor:zoom-out}
.pd-lightbox img{max-width:96%;max-height:96%;object-fit:contain}
.pd-lb-close{position:absolute;top:18px;right:24px;background:none;border:none;color:#fff;cursor:pointer;opacity:.85}
.pd-lb-close:hover{opacity:1}
.pd-thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.pd-thumbs button{width:72px;height:72px;border:1px solid var(--prp-gray-150);border-radius:8px;background:#fff;padding:6px;cursor:pointer;overflow:hidden}
.pd-thumbs button.on{border-color:var(--prp-red);box-shadow:0 0 0 1px var(--prp-red)}
.pd-thumbs img{width:100%;height:100%;object-fit:contain}
.pd-info .eyebrow{color:var(--prp-red);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:12.5px}
.pd-pn{font-size:34px;font-weight:900;letter-spacing:.01em;color:var(--prp-ink);margin:6px 0 2px}
.pd-nm{font-size:18px;color:var(--fg-2,#4a5568);margin:0 0 14px}
.pd-desc{font-size:14.5px;color:var(--fg-2,#4a5568);line-height:1.55;margin:0 0 16px}
.pd-quote-box{border:1px solid var(--prp-gray-150);border-radius:12px;padding:18px 20px;background:var(--prp-gray-100,#f7f8f9)}
.pd-quote-box .lbl{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-3,#7a8794);font-weight:800}
.pd-quote-box .price{font-size:26px;font-weight:900;color:var(--prp-ink);margin:2px 0 12px}
.pd-quote-box .pricesub{font-size:12px;font-weight:600;color:var(--fg-3,#7a8794);margin-left:8px}
.pd-spec{margin:20px 0;border-top:1px solid var(--prp-gray-150)}
.pd-spec .row{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--prp-gray-100,#eee);font-size:14.5px}
.pd-spec .k{flex:0 0 140px;color:var(--fg-3,#7a8794);font-weight:700}
.pd-spec .v{color:var(--prp-ink)}
.pd-back{display:inline-flex;align-items:center;gap:5px;color:var(--prp-red);font-weight:700;text-decoration:none;font-size:14px;margin-top:4px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="site.jsx?v=24"></script>
<script type="text/babel">
const { useState } = React;
const A = PRP_A, I = PRP_I;
const PARAMS = new URLSearchParams(window.location.search);
const P = (window.FOSTORIA_PARTS||[]).find(x=>x.id===PARAMS.get("pn"));
function NotFound() {
  return (<div className="wrap section" style={{textAlign:"center"}}>
    <h1>Element not found</h1>
    <p><a href="fostoria-elements.html">Browse Fostoria / TPI elements →</a></p>
  </div>);
}
function ZoomMain({ src, alt }) {
  const [zoom,setZoom] = useState(false);
  const [pos,setPos] = useState({x:50,y:50});
  const [light,setLight] = useState(false);
  const onMove = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    setPos({ x:((e.clientX-r.left)/r.width)*100, y:((e.clientY-r.top)/r.height)*100 });
  };
  return (
    <React.Fragment>
      <div className="main zoomable"
        onMouseEnter={()=>setZoom(true)} onMouseLeave={()=>setZoom(false)}
        onMouseMove={onMove} onClick={()=>setLight(true)}>
        <img src={src} alt={alt}
          style={{transform: zoom?"scale(2.3)":"scale(1)", transformOrigin: pos.x+"% "+pos.y+"%"}}/>
        <button className="pd-zoom-btn" aria-label="Enlarge image"
          onClick={(e)=>{e.stopPropagation(); setLight(true);}}><I.search width="19" height="19"/></button>
      </div>
      {light && <div className="pd-lightbox" onClick={()=>setLight(false)}>
        <img src={src} alt={alt}/>
        <button className="pd-lb-close" aria-label="Close"><I.x width="26" height="26"/></button>
      </div>}
    </React.Fragment>
  );
}
function Detail({ p }) {
  const gal = (p.gallery&&p.gallery.length) ? p.gallery : null;
  const [sel,setSel] = useState(0);
  const quoteHref = "contact.html?part="+encodeURIComponent(p.former);
  const rows = [
    ["Part #", <b>{p.former}</b>],
    p.old ? ["Replaces old #", p.old] : null,
    ["Manufacturer", "Direct Replacement · Made in USA"],
    ["Watts", p.watts],
    ["Volts", p.volts],
    ["Type", p.type],
  ].filter(r => r && r[1]);
  return (
    <React.Fragment>
      <div className="wrap crumb"><a href="index.html">Home</a><I.chevR width="14" height="14"/><a href="parts.html">Parts</a><I.chevR width="14" height="14"/><a href="fostoria-elements.html">Fostoria / TPI Elements</a><I.chevR width="14" height="14"/><span>#{p.former}</span></div>
      <section className="wrap section" style={{paddingTop:"6px"}}>
        <div className="pd-wrap">
          <div className="pd-gallery">
            {gal ? <ZoomMain src={A+"/products/"+gal[sel]} alt={"Fostoria/TPI "+p.former}/> : <div className="main"><span style={{color:"#9aa6b0",fontStyle:"italic"}}>Image coming soon</span></div>}
            {gal && gal.length>1 && <div className="pd-thumbs">{gal.map((g,i)=>(
              <button key={i} className={i===sel?"on":""} onClick={()=>setSel(i)}><img src={A+"/products/"+g} alt=""/></button>
            ))}</div>}
          </div>
          <div className="pd-info">
            <div className="eyebrow">Fostoria / TPI · Direct Replacement Element</div>
            <div className="pd-pn">#{p.former}</div>
            <p className="pd-nm">{p.watts} / {p.volts} · {p.type}{p.old ? "  —  replaces old #"+p.old : ""}</p>
            {p.desc && <p className="pd-desc">{p.desc}</p>}
            <div className="pd-quote-box">
              <div className="lbl">Net Price</div>
              <div className="price">{p.price!=null ? "$"+p.price.toFixed(2) : "Request a Quote"}
                {p.price!=null && <span className="pricesub">confirm current pricing &amp; availability</span>}</div>
              <a className="btn btn-red btn-lg" href={quoteHref} style={{width:"100%",justifyContent:"center"}}>Request a Quote</a>
            </div>
            <div className="pd-spec">
              {rows.map((r,i)=>(
                <div className="row" key={i}><span className="k">{r[0]}</span><span className="v">{r[1]}</span></div>
              ))}
            </div>
            <a className="pd-back" href="fostoria-elements.html"><I.chevR width="15" height="15" style={{transform:"rotate(180deg)"}}/> All Fostoria / TPI elements</a>
          </div>
        </div>
      </section>
    </React.Fragment>
  );
}
function App() {
  return (<React.Fragment><Header active="Parts" />{P ? <Detail p={P} /> : <NotFound/>}<Footer /></React.Fragment>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
