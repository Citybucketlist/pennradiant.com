<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heat Wagon Indirect-Fired Heater — Penn Radiant</title>
<meta name="description" content="Heat Wagon VG-series indirect-fired heater detail from Penn Radiant — clean, dry, ductable heat with full specifications and a fast quote.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://www.pennradiant.com/indirect-heater.html">
<meta property="og:type" content="product">
<meta property="og:site_name" content="Penn Radiant Products">
<meta property="og:image" content="https://www.pennradiant.com/assets/headers/direct-fired.jpg">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="styles.css?v=68">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <link rel="shortcut icon" href="favicon.ico">
<script src="indirect-data.js?v=1"></script>
<style>
.pd-wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:38px;align-items:start}
@media(max-width:820px){.pd-wrap{grid-template-columns:1fr;gap:22px}}
.pd-photo{position:relative;background:#fff;border:1px solid var(--prp-gray-150);border-radius:14px;display:flex;align-items:center;justify-content:center;padding:26px 26px 64px;min-height:360px}
.pd-photo img.heater{max-width:100%;max-height:400px;object-fit:contain}
.pd-photo .brandlogo{position:absolute;left:22px;bottom:20px;max-width:150px;max-height:38px;object-fit:contain}
.pd-info .eyebrow{color:var(--prp-red);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:12.5px}
.pd-pn{font-size:32px;font-weight:900;letter-spacing:.01em;color:var(--prp-ink);margin:5px 0 4px}
.pd-btu{font-size:20px;font-weight:800;color:var(--prp-ink);margin:0 0 12px}
.pd-tags{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 16px}
.pd-tag{font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--prp-gray-100,#f1f3f5);color:var(--fg-2,#4a5568)}
.pd-tag.clean{background:#eaf2fb;color:#1d5fad}
.pd-blurb{font-size:14.5px;color:var(--fg-2,#4a5568);line-height:1.55;margin:0 0 16px}
.pd-quote-box{border:1px solid var(--prp-gray-150);border-radius:12px;padding:16px 18px;background:var(--prp-gray-100,#f7f8f9)}
.pd-quote-box .lbl{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-3,#7a8794);font-weight:800}
.pd-quote-box .price{font-size:18px;font-weight:900;color:var(--prp-ink);margin:2px 0 12px}
.pd-cols{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:26px}
@media(max-width:760px){.pd-cols{grid-template-columns:1fr;gap:22px}}
.pd-spec h3,.pd-feats h3{font-size:16px;margin:0 0 10px}
.pd-spec .row{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--prp-gray-100,#eee);font-size:14px}
.pd-spec .k{flex:0 0 150px;color:var(--fg-3,#7a8794);font-weight:700}
.pd-spec .v{color:var(--prp-ink)}
.pd-feats ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.pd-feats li{position:relative;padding-left:22px;font-size:14px;color:var(--fg-2,#4a5568);line-height:1.45}
.pd-feats li i{position:absolute;left:0;top:1px;color:var(--prp-red);font-style:normal;font-weight:900}
.pd-back{display:inline-flex;align-items:center;gap:5px;color:var(--prp-red);font-weight:700;text-decoration:none;font-size:14px;margin-top:6px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="site.jsx?v=23"></script>
<script type="text/babel">
const A = PRP_A, I = PRP_I;
const PARAMS = new URLSearchParams(window.location.search);
const H = (window.INDIRECT_HEATERS||[]).find(x=>x.slug===PARAMS.get("m"));
function NotFound(){
  return (<div className="wrap section" style={{textAlign:"center"}}>
    <h1>Heater not found</h1><p><a href="indirect-fired-heaters.html">Browse indirect-fired heaters →</a></p></div>);
}
function Detail({ h }){
  const quoteHref="contact.html?product="+encodeURIComponent(h.brand+" "+h.model);
  return (
    <React.Fragment>
      <div className="wrap crumb"><a href="index.html">Home</a><I.chevR width="14" height="14"/><a href="gas-heating.html">Gas Heating</a><I.chevR width="14" height="14"/><a href="indirect-fired-heaters.html">Indirect-Fired Heaters</a><I.chevR width="14" height="14"/><span>{h.brand} {h.model}</span></div>
      <section className="wrap section" style={{paddingTop:"6px"}}>
        <div className="pd-wrap">
          <div className="pd-photo">
            <img className="heater" src={A+"/products/indirect-fired/"+h.img} alt={h.brand+" "+h.model}/>
            <img className="brandlogo" src={A+"/brands/"+h.brandLogo} alt={h.brand}/>
          </div>
          <div className="pd-info">
            <div className="eyebrow">{h.brand} · Indirect-Fired Heater</div>
            <div className="pd-pn">{h.model}</div>
            <div className="pd-btu">{h.btu}</div>
            <div className="pd-tags">
              <span className="pd-tag clean">Indirect · Clean &amp; Dry Heat</span>
              <span className="pd-tag">Ductable</span>
            </div>
            <p className="pd-blurb">{h.blurb}</p>
            <div className="pd-quote-box">
              <div className="lbl">Pricing</div>
              <div className="price">Request a Quote</div>
              <a className="btn btn-red btn-lg" href={quoteHref} style={{width:"100%",justifyContent:"center"}}>Request a Quote</a>
            </div>
          </div>
        </div>
        <div className="pd-cols">
          <div className="pd-spec">
            <h3>Specifications</h3>
            {h.specs.map((r,i)=>(<div className="row" key={i}><span className="k">{r[0]}</span><span className="v">{r[1]}</span></div>))}
            <div className="row"><span className="k">Brand</span><span className="v">{h.brand}</span></div>
          </div>
          {h.feats&&h.feats.length>0 && <div className="pd-feats">
            <h3>Features</h3>
            <ul>{h.feats.map((f,i)=>(<li key={i}><i>▸</i><span dangerouslySetInnerHTML={{__html:f}}/></li>))}</ul>
          </div>}
        </div>
        <div style={{marginTop:"24px",display:"flex",gap:"18px",flexWrap:"wrap",alignItems:"center"}}>
          <a className="pd-back" href="indirect-fired-heaters.html"><I.chevR width="15" height="15" style={{transform:"rotate(180deg)"}}/> All indirect-fired heaters</a>
          <a className="pd-back" href={h.cat} target="_blank" rel="noreferrer">View on catalog <I.chevR width="14" height="14"/></a>
        </div>
      </section>
    </React.Fragment>
  );
}
function App(){
  return (<React.Fragment><Header active="Gas Heating" />{H ? <Detail h={H}/> : <NotFound/>}<Footer /></React.Fragment>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
