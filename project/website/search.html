<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search — Penn Radiant</title>
<meta name="description" content="Search Penn Radiant replacement parts by part number or item name.">
<meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="styles.css?v=68">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <link rel="shortcut icon" href="favicon.ico">
<script src="sr-parts-data.js?v=17"></script>
<script src="aitken-data.js?v=2"></script>
<script src="fostoria-data.js?v=2"></script>
<script src="portable-data.js?v=2"></script>
<script src="fixed-data.js?v=2"></script>
<script src="quartz-data.js?v=1"></script>
<script src="search-index.js?v=1"></script>
<style>
.sr-box{display:flex;gap:10px;max-width:640px;margin:2px 0 6px}
.sr-box .fld{flex:1;display:flex;align-items:center;gap:9px;border:1px solid var(--prp-gray-300);border-radius:var(--r-md);padding:11px 14px;background:#fff}
.sr-box .fld input{border:0;outline:none;font-size:15px;font-family:inherit;width:100%;background:transparent}
.sr-count{font-size:13.5px;color:var(--fg-3,#7a8794);margin:6px 0 18px}
.sr-count b{color:var(--prp-ink)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column;border:1px solid var(--prp-gray-150);border-radius:10px;overflow:hidden;background:#fff;text-decoration:none;color:var(--prp-ink);transition:border-color .15s,box-shadow .15s,transform .15s}
.pcard:hover{border-color:var(--prp-red);box-shadow:0 6px 18px rgba(0,0,0,.09);transform:translateY(-2px)}
.pcard .ph{height:168px;background:#fff;border-bottom:1px solid var(--prp-gray-100,#f3f4f6);display:flex;align-items:center;justify-content:center;padding:14px}
.pcard .ph img{max-width:100%;max-height:100%;object-fit:contain}
.pcard .ph.none{color:var(--prp-gray-400,#9aa6b0);font-size:12px;font-style:italic}
.pcard .body{padding:11px 13px 13px;display:flex;flex-direction:column;flex:1}
.pcard .brand{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--prp-red)}
.pcard .pn{font-weight:900;font-size:16px;letter-spacing:.02em;margin-top:2px}
.pcard .nm{font-size:12.5px;color:var(--fg-2,#4a5568);margin-top:2px;line-height:1.32}
.pcard .xhit{margin-top:6px;font-size:11px;font-weight:800;letter-spacing:.01em;color:var(--prp-ink);background:var(--prp-gray-100,#f1f3f5);border-radius:6px;padding:5px 7px;line-height:1.3}
.pcard .view{margin-top:auto;padding-top:10px;font-size:12.5px;font-weight:800;color:var(--prp-red);display:flex;align-items:center;gap:4px}
.sr-empty{border:1px solid var(--prp-gray-150);border-radius:14px;background:var(--prp-gray-100,#f7f8f9);padding:30px 26px;max-width:720px}
.sr-empty h3{margin:0 0 8px}
.sr-empty p{font-size:14.5px;color:var(--fg-2,#4a5568);line-height:1.55;margin:0 0 14px}
.sr-empty .row{display:flex;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="site.jsx?v=26"></script>
<script type="text/babel">
const A = PRP_A, CAT = PRP_CAT, I = PRP_I;
const Q = (new URLSearchParams(window.location.search).get("q")||"").trim();

const CATLABEL = {tube:"Space Ray · Tube Parts", ceramic:"Space Ray · Ceramic Parts", salamander:"Space Ray · RFPA Parts"};
/* every cross-referenced part # (other brands' current + old numbers) — searchable as alternates */
const xrefNums = xr => (xr||[]).flatMap(x=>[x.pn, x.old]).filter(Boolean);
function buildIndex(){
  const out=[];
  (window.SR_PARTS||[]).forEach(p=>out.push({
    pn:p.pn, nm:p.nm, cat:CATLABEL[p.cat]||"Space Ray Parts",
    extra:((p.models||[]).join(" ")+" "+(p.group||"")),
    src:(p.gallery&&p.gallery[0])?A+"/products/"+p.gallery[0]:null, href:"part-detail.html?pn="+encodeURIComponent(p.id)
  }));
  (window.AITKEN_PARTS||[]).forEach(p=>{ const s=p.specs||{};
    out.push({ pn:p.pn, nm:p.nm, cat:p.cat==="quartz"?"Aitken · Quartz Element":"Aitken · Element",
      alt:xrefNums(p.xref),
      extra:((s.fits||"")+" "+(s.wv||"")+" "+(s.type||"")+" "+xrefNums(p.xref).join(" ")),
      src:(p.gallery&&p.gallery[0])?A+"/products/"+p.gallery[0]:null, href:"aitken-element.html?pn="+encodeURIComponent(p.pn) });
  });
  (window.FOSTORIA_PARTS||[]).forEach(p=>out.push({
    pn:p.former, nm:p.nm, cat:"Fostoria / TPI · Element",
    alt:[p.old].filter(Boolean).concat(xrefNums(p.xref)),
    extra:((p.old||"")+" "+(p.watts||"")+" "+(p.volts||"")+" "+(p.type||"")+" "+(p.fits||"")+" "+xrefNums(p.xref).join(" ")),
    src:(p.gallery&&p.gallery[0])?A+"/products/"+p.gallery[0]:null, href:"fostoria-element.html?pn="+encodeURIComponent(p.id) }));
  (window.PORTABLE_HEATERS||[]).forEach(h=>(h.variants||[]).forEach(v=>out.push({
    pn:v.m, nm:"Aitken "+h.series+" "+h.kw+" Portable Infrared · "+v.v, cat:"Aitken · Portable Infrared Heater",
    extra:h.series+" "+h.kw+" "+v.v+" "+v.e, src:A+"/products/"+h.img, href:"portable-infrared-heaters.html" })));
  (window.FIXED_HEATERS||[]).forEach(h=>(h.variants||[]).forEach(v=>out.push({
    pn:v.m, nm:"Aitken "+h.series+" "+h.kw+" Overhead Infrared · "+v.v, cat:"Aitken · Fixed Overhead Heater",
    extra:h.series+" "+h.kw+" "+v.v+" "+v.e, src:A+"/products/"+h.img, href:"fixed-infrared-heaters.html" })));
  (window.QUARTZ_HEATERS||[]).forEach(h=>(h.variants||[]).forEach(v=>out.push({
    pn:v.m, nm:"Aitken "+h.nm+" · "+v.w, cat:"Aitken · Quartz Solar Beam Heater",
    extra:h.angle+" solar beam quartz "+v.v+" "+v.w, src:A+"/products/"+h.img, href:"quartz-heaters.html" })));
  (window.SEARCH_INDEX||[]).forEach(p=>out.push(p));  // Heat Wagon & Sure Flame model parts + regulators (pre-built src/href)
  return out;
}
// strip a leading part-# label people commonly type: #, P#, P/N, PN, PART #, NO., ITEM #
// (won't strip a bare leading letter, so real part #s like Aitken "P70010" stay intact)
function stripPrefix(raw){
  const q = (raw||"").trim();
  const s = q.replace(/^(?:part\s*(?:no\.?|number)?\s*#?|item\s*#?|p\s*\/\s*n|p\s*#|pn(?=[\s#:/-]|\d)|no\.?\s|#)\s*[:#/\-]*\s*/i, "");
  return (s.trim() || q);
}
const collapse = s => (s||"").toLowerCase().replace(/[^a-z0-9]/g,"");  // ignore spaces/dashes/# in part #s
function runSearch(raw){
  const q = stripPrefix(raw).toLowerCase();
  if(!q) return [];
  const qc = collapse(q);
  const res=[];
  buildIndex().forEach(it=>{
    const pnc=collapse(it.pn), nm=(it.nm||"").toLowerCase(), ex=(it.extra||"").toLowerCase();
    const altc=(it.alt||[]).map(collapse).filter(Boolean);
    let s=-1, hit=null;
    if(qc && pnc===qc) s=0;
    else if(qc && (hit=altc.find(a=>a===qc))) s=1;              // exact cross-reference match
    else if(qc && pnc.startsWith(qc)) s=2;
    else if(qc && (hit=altc.find(a=>a.startsWith(qc)))) s=3;
    else if(qc && pnc.includes(qc)) s=4;
    else if(qc && (hit=altc.find(a=>a.includes(qc)))) s=5;
    else if(nm.includes(q)) s=6;
    else if(ex.includes(q)) s=7;
    if(s>=0) res.push([s, Object.assign({}, it, {xhit: s>=1 && s<=5 && hit ? true : false})]);
  });
  res.sort((a,b)=> a[0]-b[0] || a[1].pn.localeCompare(b[1].pn));
  return res.map(x=>x[1]);
}
function go(v){ const t=(v||"").trim(); window.location.href="search.html"+(t?"?q="+encodeURIComponent(t):""); }

function Card({r}){
  return (
    <a className="pcard" href={r.href}>
      {r.src ? <div className="ph"><img src={r.src} alt={r.pn}/></div> : <div className="ph none">No image</div>}
      <div className="body">
        <div className="brand">{r.cat}</div>
        <div className="pn">{r.pn}</div>
        <div className="nm">{r.nm}</div>
        {r.xhit && (r.alt||[]).length>0 && <div className="xhit">Also replaces {r.alt.join(" · ")}</div>}
        <div className="view">View details <I.chevR width="14" height="14"/></div>
      </div>
    </a>
  );
}
function App(){
  const results = Q ? runSearch(Q) : [];
  return (
    <React.Fragment>
      <Header active="Parts" />
      <div className="pagehero light"><div className="wrap">
        <div className="eyebrow">Search</div>
        <h1>{Q ? <React.Fragment>Results for &ldquo;{Q}&rdquo;</React.Fragment> : "Search Parts"}</h1>
        <div className="sr-box">
          <div className="fld">
            <I.search width="18" height="18" style={{color:"var(--prp-gray-500)",flex:"none"}}/>
            <input id="site-search-page" defaultValue={Q} placeholder="Part # or item name…" autoFocus
                   onKeyDown={e=>{if(e.key==="Enter")go(e.target.value);}}/>
          </div>
          <a className="btn btn-red" onClick={()=>go(document.getElementById("site-search-page").value)}>Search</a>
        </div>
      </div></div>
      <div className="wrap crumb"><a href="index.html">Home</a><I.chevR width="14" height="14"/><a href="parts.html">Parts</a><I.chevR width="14" height="14"/><span>Search</span></div>

      <section className="wrap section" style={{paddingTop:"8px"}}>
        {Q && <p className="sr-count"><b>{results.length}</b> {results.length===1?"part":"parts"} found on the site{results.length?"":" for this search"}.</p>}
        {results.length>0
          ? <div className="pgrid">{results.map((r,i)=><Card r={r} key={i}/>)}</div>
          : <div className="sr-empty">
              <h3>{Q ? "No matching parts on the site yet" : "Enter a part # or item name"}</h3>
              <p>{Q
                ? "We couldn’t find that part in our online listings — but we very likely stock it. Send it to our parts team for a fast quote, or check the full catalog."
                : "Search genuine Space-Ray and Aitken replacement parts by part number or item name."}</p>
              {Q && <div className="row">
                <a className="btn btn-red" href={"contact.html?part="+encodeURIComponent(Q)}>Request this part</a>
                <a className="btn btn-outline" href={CAT+"/search?q="+encodeURIComponent(Q)} target="_blank" rel="noreferrer">Search full catalog</a>
              </div>}
            </div>}
      </section>
      <Footer />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
