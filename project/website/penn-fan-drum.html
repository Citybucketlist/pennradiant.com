<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Industrial Drum Fans — Penn Fan — Penn Radiant</title>
<meta name="description" content="Penn Fan Type-D industrial drum fans from Penn Radiant — 24 to 48 inch, up to 42,000 CFM, single- or three-phase. Pick your mounting — four legs, casters, ceiling tilt-swivel, yoke or pedestal — and get a quote. American made.">
<meta name="keywords" content="Penn Radiant, Penn Fan, industrial drum fan, drum mancooler, spot cooling fan, 4 legs with casters, ceiling mount tilt swivel, pedestal fan, yoke mount fan, 24 30 36 42 48 inch drum fan, D48B7.5X, made in USA">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://www.pennradiant.com/penn-fan-drum.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Penn Radiant Products">
<meta property="og:title" content="Industrial Drum Fans — Penn Fan — Penn Radiant">
<meta property="og:description" content="Penn Fan Type-D industrial drum fans — 24 to 48 inch, up to 42,000 CFM. Choose your mounting and get a quote. American made.">
<meta property="og:url" content="https://www.pennradiant.com/penn-fan-drum.html">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <link rel="shortcut icon" href="favicon.ico">
<script src="drum-fan-data.js?v=1"></script>
<style>
.df-hero{background:linear-gradient(180deg,var(--prp-gray-100,#f6f7f9),#fff);border-bottom:1px solid var(--prp-gray-100,#eef0f2)}
.df-hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:26px;align-items:center;padding:38px 0 30px}
@media(max-width:860px){.df-hero .wrap{grid-template-columns:1fr;gap:14px;padding:28px 0 22px}}
.df-hero .eyebrow{color:var(--prp-blue-bright,#1f6fb2);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:12.5px}
.df-hero h1{font-size:38px;line-height:1.05;margin:8px 0 12px}
@media(max-width:860px){.df-hero h1{font-size:29px}}
.df-hero p{color:var(--fg-2,#4a5568);font-size:15.5px;line-height:1.55;max-width:600px}
.df-hero .pic{display:flex;justify-content:center}
.df-hero .pic img{max-height:320px;width:auto;filter:drop-shadow(0 14px 26px rgba(0,0,0,.16))}
.df-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.df-badge{font-size:12.5px;font-weight:800;background:#fff;border:1px solid var(--prp-gray-150);color:var(--prp-ink);padding:7px 13px;border-radius:999px}
.df-badge b{color:var(--prp-blue-bright,#1f6fb2)}
.df-step{display:flex;align-items:center;gap:11px;margin:0 0 4px}
.df-step .n{flex:none;width:27px;height:27px;border-radius:50%;background:var(--prp-blue-bright,#1f6fb2);color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}
.df-step h2{font-size:20px;margin:0}
.df-note{font-size:13px;color:var(--fg-3,#7a8794);margin:2px 0 16px;max-width:820px;line-height:1.5}
.df-mounts{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px}
.df-mount{position:relative;display:flex;flex-direction:column;border:1px solid var(--prp-gray-150);border-radius:12px;background:#fff;cursor:pointer;overflow:hidden;text-align:left;padding:0;transition:border-color .15s,box-shadow .15s,transform .15s}
.df-mount:hover{border-color:var(--prp-blue-bright,#1f6fb2);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.df-mount.on{border-color:var(--prp-blue-bright,#1f6fb2);box-shadow:0 0 0 2px var(--prp-blue-bright,#1f6fb2)}
.df-mount .ph{height:150px;background:#fff;display:flex;align-items:center;justify-content:center;padding:12px}
.df-mount .ph img{max-width:100%;max-height:100%;object-fit:contain}
.df-mount .lab{padding:9px 12px 12px;border-top:1px solid var(--prp-gray-100,#f2f4f6)}
.df-mount .code{font-size:10.5px;font-weight:800;letter-spacing:.05em;color:var(--prp-blue-bright,#1f6fb2)}
.df-mount .nm{font-size:13.5px;font-weight:800;color:var(--prp-ink);margin-top:1px;line-height:1.25}
.df-mount .pop{position:absolute;top:9px;right:9px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:var(--prp-blue-bright,#1f6fb2);color:#fff;padding:3px 8px;border-radius:999px}
.df-check{position:absolute;top:9px;left:9px;width:22px;height:22px;border-radius:50%;background:var(--prp-blue-bright,#1f6fb2);color:#fff;display:none;align-items:center;justify-content:center;font-weight:900;font-size:13px}
.df-mount.on .df-check{display:flex}
.df-config{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border:1px solid var(--prp-gray-150);border-left:4px solid var(--prp-blue-bright,#1f6fb2);border-radius:14px;background:var(--prp-gray-100,#f7f8f9);padding:14px 20px;margin:22px 0 0}
.df-config .thumb{flex:none;width:82px;height:82px;background:#fff;border:1px solid var(--prp-gray-150);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:6px}
.df-config .thumb img{max-width:100%;max-height:100%;object-fit:contain}
.df-config .txt{flex:1;min-width:240px}
.df-config .eb{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--prp-blue-bright,#1f6fb2)}
.df-config .cf{font-size:18px;font-weight:900;color:var(--prp-ink);margin:2px 0 2px}
.df-config .cd{font-size:13px;color:var(--fg-2,#4a5568);line-height:1.45}
.df-controls{display:flex;flex-wrap:wrap;gap:22px;margin:22px 0 14px}
.df-ctl{display:flex;flex-direction:column;gap:7px}
.df-ctl .cl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-3,#7a8794)}
.df-seg{display:inline-flex;border:1px solid var(--prp-gray-300);border-radius:9px;overflow:hidden;background:#fff}
.df-seg button{border:0;background:#fff;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--prp-ink);padding:8px 14px;cursor:pointer;border-right:1px solid var(--prp-gray-200,#e6e9ec)}
.df-seg button:last-child{border-right:0}
.df-seg button.on{background:var(--prp-blue-bright,#1f6fb2);color:#fff}
.df-seg button small{display:block;font-size:9.5px;font-weight:700;opacity:.75;letter-spacing:.03em;text-transform:uppercase}
.df-tablewrap{overflow-x:auto;border:1px solid var(--prp-gray-150);border-radius:12px;background:#fff;margin-top:4px}
.df-table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
.df-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-3,#7a8794);font-weight:800;padding:12px 14px;border-bottom:2px solid var(--prp-gray-150);background:var(--prp-gray-100,#f7f8f9);white-space:nowrap}
.df-table td{padding:11px 14px;border-bottom:1px solid var(--prp-gray-100,#eee);color:var(--fg-2,#4a5568);white-space:nowrap}
.df-table tbody tr:last-child td{border-bottom:0}
.df-table tbody tr:hover{background:var(--prp-gray-100,#f9fafb)}
.df-table td.m{font-weight:900;color:var(--prp-ink);letter-spacing:.01em}
.df-table td.cfm{font-weight:800;color:var(--prp-ink)}
.df-table td.cfm b{color:var(--prp-blue-bright,#1f6fb2)}
.df-qa{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;color:var(--prp-blue-bright,#1f6fb2);text-decoration:none;white-space:nowrap}
.df-qa:hover{text-decoration:underline}
.df-cap{font-size:12.5px;color:var(--fg-3,#7a8794);margin:10px 2px 0}
.df-dims{display:grid;grid-template-columns:1.3fr .7fr;gap:26px;align-items:center;border:1px solid var(--prp-gray-150);border-radius:14px;background:#fff;padding:20px 22px;margin-top:8px}
@media(max-width:760px){.df-dims{grid-template-columns:1fr}}
.df-dims img{max-width:100%;height:auto}
.df-dims .dt h3{font-size:16px;margin:0 0 3px}
.df-dims .dt .sub{font-size:12.5px;color:var(--fg-3,#7a8794);margin:0 0 12px}
.df-dims table{width:100%;border-collapse:collapse;font-size:13.5px}
.df-dims td{padding:7px 0;border-bottom:1px solid var(--prp-gray-100,#eee)}
.df-dims td.k{color:var(--fg-3,#7a8794);font-weight:700}
.df-dims td.v{text-align:right;font-weight:800;color:var(--prp-ink)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="site.jsx?v=26"></script>
<script type="text/babel">
const { useState } = React;
const A = PRP_A, I = PRP_I;
const D = window.DRUM_FAN || {models:[],mounts:[],blades:[],sizes:[],phases:[]};
const fmt = n => (n!=null ? n.toLocaleString() : "—");

function App(){
  const [mount,setMount] = useState((D.mounts.find(m=>m.popular)||D.mounts[0]||{}).code);
  const [phase,setPhase] = useState("3");
  const [size,setSize]   = useState("all");
  const [blade,setBlade] = useState("steel");

  const M  = D.mounts.find(m=>m.code===mount) || D.mounts[0] || {};
  const bl = D.blades.find(b=>b.key===blade) || D.blades[0] || {};
  const rows = D.models.filter(m => m.ph===phase && (size==="all" || m.size===+size));
  const suffix = M.code ? "-"+M.code : "";
  const quoteFor = model => "contact.html?product="+encodeURIComponent(
    "Penn Fan "+model+suffix+" Drum Fan — "+bl.label+" blade");
  const maxCfm = Math.max.apply(null, D.models.map(m=>m.cfm.steel));

  return (
    <React.Fragment>
      <Header active="Cooling" />
      <section className="df-hero"><div className="wrap">
        <div>
          <div className="eyebrow">Penn Fan · Type-D Industrial</div>
          <h1>Industrial Drum Fans</h1>
          <p>Heavy-duty drum-style mancoolers built for steel mills, forges, foundries and shops. The motor and blade sit inside the drum body for powerful, directable spot cooling &mdash; from 24&Prime; up to 48&Prime;, moving up to {fmt(maxCfm)}&nbsp;CFM. American made by Penn&nbsp;Fan.</p>
          <div className="df-badges">
            <span className="df-badge"><b>24&Prime;</b>&ndash;<b>48&Prime;</b> blade</span>
            <span className="df-badge">up to <b>{fmt(maxCfm)}</b> CFM</span>
            <span className="df-badge">1&Oslash; &amp; 3&Oslash;</span>
            <span className="df-badge">Steel · Nylon · Cast Alum</span>
            <span className="df-badge">USA made</span>
          </div>
        </div>
        <div className="pic"><img src={A+"/products/cooling/drum/4lwc.png"} alt="Penn Fan industrial drum fan on four legs with casters"/></div>
      </div></section>
      <div className="wrap crumb"><a href="index.html">Home</a><I.chevR width="14" height="14"/><a href="cooling.html">Cooling</a><I.chevR width="14" height="14"/><span>Industrial Drum Fans</span></div>

      {/* STEP 1 — MOUNTING */}
      <section className="wrap section" style={{paddingTop:"10px"}}>
        <div className="df-step"><span className="n">1</span><h2>Choose your mounting</h2></div>
        <p className="df-note">Every drum fan uses the same drum body and blade &mdash; the mounting is how it lives in your space. Pick one; the specs below stay the same, and your quote carries the mounting you choose.</p>
        <div className="df-mounts">
          {D.mounts.map(m=>(
            <button key={m.code} className={"df-mount"+(m.code===mount?" on":"")} onClick={()=>setMount(m.code)}>
              {m.popular && <span className="pop">Popular</span>}
              <span className="df-check">&#10003;</span>
              <div className="ph"><img src={A+"/products/"+m.img} alt={"Drum fan — "+m.name}/></div>
              <div className="lab"><div className="code">{m.code}</div><div className="nm">{m.name}</div></div>
            </button>
          ))}
        </div>
        {D.mountsNote && <p className="df-cap">{D.mountsNote}</p>}
      </section>

      {/* STEP 2 — SIZE & POWER */}
      <section className="wrap section" style={{paddingTop:"6px"}}>
        <div className="df-step"><span className="n">2</span><h2>Choose size &amp; power</h2></div>

        <div className="df-config">
          <div className="thumb"><img src={A+"/products/"+M.img} alt={M.name}/></div>
          <div className="txt">
            <div className="eb">Your configuration</div>
            <div className="cf">Drum Fan · {M.name}</div>
            <div className="cd">{M.desc} <b>{bl.label}</b> blade{bl.std?" (standard)":" (option)"}.</div>
          </div>
          <a className="btn btn-blue" href={"contact.html?product="+encodeURIComponent("Penn Fan Drum Fan — "+M.name+" — "+bl.label+" blade")}>Request a Quote</a>
        </div>

        <div className="df-controls">
          <div className="df-ctl"><span className="cl">Power</span>
            <div className="df-seg">
              {D.phases.map(p=>(
                <button key={p.key} className={p.key===phase?"on":""} onClick={()=>setPhase(p.key)}>{p.label}</button>
              ))}
            </div>
          </div>
          <div className="df-ctl"><span className="cl">Blade diameter</span>
            <div className="df-seg">
              <button className={size==="all"?"on":""} onClick={()=>setSize("all")}>All</button>
              {D.sizes.map(s=>(
                <button key={s} className={String(s)===String(size)?"on":""} onClick={()=>setSize(s)}>{s}&Prime;</button>
              ))}
            </div>
          </div>
          <div className="df-ctl"><span className="cl">Blade material</span>
            <div className="df-seg">
              {D.blades.map(b=>(
                <button key={b.key} className={b.key===blade?"on":""} onClick={()=>setBlade(b.key)}>{b.label}<small>{b.note}</small></button>
              ))}
            </div>
          </div>
        </div>

        <div className="df-tablewrap">
          <table className="df-table"><thead>
            <tr><th>Model</th><th>HP</th><th>RPM</th><th>Voltage</th><th>CFM<span style={{textTransform:"none",fontWeight:700}}> · {bl.label}</span></th><th></th></tr>
          </thead><tbody>
            {rows.map((m,i)=>(
              <tr key={i}>
                <td className="m">{m.model}{suffix}</td>
                <td>{m.hp}</td>
                <td>{fmt(m.rpm)}</td>
                <td>{m.volts}</td>
                <td className="cfm"><b>{fmt(m.cfm[blade])}</b></td>
                <td><a className="df-qa" href={quoteFor(m.model)}>Quote <I.chevR width="13" height="13"/></a></td>
              </tr>
            ))}
          </tbody></table>
        </div>
        <p className="df-cap">Airflow shown as CFM at free air (0&Prime; w.g.) with the <b>{bl.label.toLowerCase()}</b> blade. Galvanized steel is standard; nylon &amp; cast-aluminum blades are options. Two-speed / variable-speed, 50&nbsp;Hz &amp; 575&nbsp;V, and custom finishes (hot-dipped galvanized, aluminum, 304/316 stainless) available &mdash; confirm final selection &amp; pricing at quote.</p>
      </section>

      {/* DIMENSIONS */}
      {D.dimsExample && (
      <section className="wrap section" style={{paddingTop:"0"}}>
        <div className="df-step"><span className="n" style={{background:"var(--prp-ink)"}}>&#8942;</span><h2>Dimensions</h2></div>
        <p className="df-note">Example build below. Overall dimensions vary by blade size &amp; mounting &mdash; we&rsquo;ll confirm exact dimensions &amp; weight for your configuration at quote.</p>
        <div className="df-dims">
          <img src={A+"/products/"+D.dimsExample.img} alt={"Penn Fan "+D.dimsExample.model+" dimensioned drawing"}/>
          <div className="dt">
            <h3>{D.dimsExample.model}</h3>
            <div className="sub">{D.dimsExample.size}&Prime; · {D.dimsExample.mount}</div>
            <table><tbody>
              <tr><td className="k">A — Overall height</td><td className="v">{D.dimsExample.A}</td></tr>
              <tr><td className="k">B — Fan height</td><td className="v">{D.dimsExample.B}</td></tr>
              <tr><td className="k">C — Overall width</td><td className="v">{D.dimsExample.C}</td></tr>
              <tr><td className="k">D — Base depth</td><td className="v">{D.dimsExample.D}</td></tr>
              <tr><td className="k">Approx. weight</td><td className="v">{D.dimsExample.weight}</td></tr>
            </tbody></table>
          </div>
        </div>
      </section>
      )}

      <section className="band">
        <div className="band-shade" style={{background:"var(--prp-navy)"}}></div>
        <div className="wrap band-inner">
          <span className="eb" style={{background:"var(--prp-blue-bright)"}}>Built for the harshest floors</span>
          <h2>Spec Your Drum Fan</h2>
          <ul>
            <li><i className="tri" style={{color:"var(--prp-blue-bright)"}}>&#9656;</i>24&ndash;48&Prime; · single- or three-phase · up to {fmt(maxCfm)} CFM</li>
            <li><i className="tri" style={{color:"var(--prp-blue-bright)"}}>&#9656;</i>Four-leg, casters, ceiling tilt-swivel, yoke &amp; pedestal mounts</li>
            <li><i className="tri" style={{color:"var(--prp-blue-bright)"}}>&#9656;</i>American made · fast quotes &amp; nationwide LTL shipping</li>
          </ul>
          <a className="btn btn-blue btn-lg" href="contact.html?product=Penn%20Fan%20Industrial%20Drum%20Fan">Request a Quote</a>
        </div>
      </section>

      <Footer />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
