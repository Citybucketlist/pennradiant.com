<style>
.pih-hero{background:linear-gradient(180deg,var(--prp-gray-100,#f6f7f9),#fff);border-bottom:1px solid var(--prp-gray-100,#eef0f2)}
.pih-hero .wrap{padding:38px 0 26px}
.pih-hero .eyebrow{color:var(--prp-red);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:12.5px}
.pih-hero h1{font-size:38px;line-height:1.05;margin:8px 0 12px}
@media(max-width:860px){.pih-hero h1{font-size:30px}}
.pih-hero p{color:var(--fg-2,#4a5568);font-size:15.5px;line-height:1.55;max-width:640px}
.pih-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pih-badge{font-size:12.5px;font-weight:800;background:#fff;border:1px solid var(--prp-gray-150);color:var(--prp-ink);padding:7px 13px;border-radius:999px}
.pih-badge b{color:var(--prp-red)}
.pih{display:grid;grid-template-columns:.85fr 1.15fr;gap:36px;align-items:center;padding:8px 0}
.pih.rev{grid-template-columns:1.15fr .85fr}
.pih.rev .pih-pic{order:2}
@media(max-width:820px){.pih,.pih.rev{grid-template-columns:1fr;gap:18px}.pih.rev .pih-pic{order:0}}
.pih-pic{background:#fff;border:1px solid var(--prp-gray-150);border-radius:16px;display:flex;align-items:center;justify-content:center;padding:22px}
.pih-pic img{max-width:100%;max-height:320px;object-fit:contain}
.pih-eyebrow{color:var(--prp-red);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:12px}
.pih h2{font-size:26px;margin:5px 0 4px}
.pih-sub{font-size:13.5px;color:var(--fg-3,#7a8794);font-weight:700;margin:0 0 12px}
.pih-desc{font-size:14.5px;color:var(--fg-2,#4a5568);line-height:1.6;margin:0 0 16px}
.pih-desc b{color:var(--prp-ink)}
.pih-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pih-chip{font-size:12.5px;font-weight:800;background:var(--prp-gray-100,#f1f3f5);color:var(--prp-ink);padding:7px 12px;border-radius:8px}
.pih-chip b{color:var(--prp-red)}
.pih-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:16px}
.pih-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-3,#7a8794);border-bottom:2px solid var(--prp-gray-150);padding:7px 10px 7px 0}
.pih-table td{padding:8px 10px 8px 0;border-bottom:1px solid var(--prp-gray-100,#eee)}
.pih-table td.m{font-weight:800;color:var(--prp-ink)}
.pih-cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pih-note{font-size:13px;color:var(--fg-3,#7a8794);font-weight:700}
.pih-hr{border:0;border-top:1px solid var(--prp-gray-150);margin:6px 0}
.pih-parts{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border:1px solid var(--prp-gray-150);border-left:4px solid var(--prp-red);border-radius:14px;background:var(--prp-gray-100,#f7f8f9);padding:16px 22px}
.pih-parts .thumb{flex:none;width:72px;height:72px;background:#fff;border:1px solid var(--prp-gray-150);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:7px}
.pih-parts .thumb img{max-width:100%;max-height:100%;object-fit:contain}
.pih-parts .m{flex:1;min-width:260px;display:flex;flex-direction:column;gap:3px}
.pih-parts .eb{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--prp-red)}
.pih-parts b{font-size:16px;color:var(--prp-ink)}
.pih-parts .sub{font-size:13.5px;color:var(--fg-2,#4a5568);line-height:1.45}
.pih-parts .btn{flex:none}

<body>
<div id="root"></div>
<script type="text/babel" src="site.jsx?v=26"></script>
<script type="text/babel">
const A = PRP_A, I = PRP_I;
const HEATERS = window.QUARTZ_HEATERS || [];
function Heater({ h, i }){
  const rev = i % 2 === 1;
  const quote = "contact.html?product="+encodeURIComponent("Aitken "+h.nm+" Quartz Heater");
  return (
    <React.Fragment>
      {i>0 && <hr className="pih-hr"/>}
      <div className={"pih"+(rev?" rev":"")}>
        <div className="pih-pic"><img src={A+"/products/"+h.img} alt={"Aitken "+h.nm+" quartz heater"}/></div>
        <div className="pih-body">
          <div className="pih-eyebrow">Aitken · All-Weather Quartz</div>
          <h2>{h.nm}</h2>
          <div className="pih-sub">Solar Beam quartz lamp heater · {h.variants.length} sizes</div>
          <p className="pih-desc" dangerouslySetInnerHTML={{__html:h.desc}}/>
          <div className="pih-chips">
            <span className="pih-chip"><b>{h.angle.split(" ")[0]}</b> beam</span>
            <span className="pih-chip">1,000–5,000 W</span>
            <span className="pih-chip">120–480 V</span>
            <span className="pih-chip">All-weather</span>
          </div>
          <table className="pih-table"><thead>
            <tr><th>Model</th><th>Wattage</th><th>Voltage</th><th>Amps</th><th>Size (H×W×D)</th></tr>
          </thead><tbody>
            {h.variants.map((v,j)=>(
              <tr key={j}><td className="m">{v.m}</td><td>{v.w}</td><td>{v.v}</td><td>{v.a}</td><td>{v.size}</td></tr>
            ))}
          </tbody></table>
          <div className="pih-cta">
            <a className="btn btn-red" href={quote}>Request a Quote</a>
            <span className="pih-note">Quoted by application · confirm current pricing</span>
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}
function App(){
  return (
    <React.Fragment>
      <Header active="Electric Heating" />
      <section className="pih-hero"><div className="wrap">
        <div className="eyebrow">Aitken · All-Weather Quartz</div>
        <h1>Valet Quartz &amp; Solar Beam Heaters</h1>
        <p>Weatherproof quartz-lamp radiant heat that works outdoors — rain, wind or wash-down. Aitken&rsquo;s Solar&nbsp;Beam heaters come in two beam patterns, 60° asymmetrical and 90° symmetrical, from 1,000 to 5,000&nbsp;watts. Instant, directional infrared for patios, entryways, loading docks and covered outdoor areas.</p>
        <div className="pih-badges">
          <span className="pih-badge"><b>60°</b> &amp; <b>90°</b> beam</span>
          <span className="pih-badge">1,000–5,000 W</span>
          <span className="pih-badge">120–480 V</span>
          <span className="pih-badge">All-weather · USA</span>
        </div>
      </div></section>
      <div className="wrap crumb"><a href="index.html">Home</a><I.chevR width="14" height="14"/><a href="electric-heating.html">Electric Heating</a><I.chevR width="14" height="14"/><span>Valet Quartz Heaters</span></div>

      <section className="wrap section" style={{paddingTop:"10px"}}>
        <div className="eyebrow-row"><h2><span className="lt">CHOOSE YOUR</span> BEAM PATTERN</h2></div>
        <p className="pih-note" style={{fontWeight:400,color:"var(--fg-3,#7a8794)",margin:"2px 0 20px",maxWidth:"820px",lineHeight:1.55,fontSize:"13px"}}>Pick the beam that fits how you&rsquo;re mounting: <b>asymmetrical (60°)</b> aims heat forward from a wall or corner; <b>symmetrical (90°)</b> spreads it evenly straight down from overhead.</p>
        {HEATERS.map((h,i)=><Heater h={h} i={i} key={i}/>)}
      </section>

      <section className="wrap section" style={{paddingTop:"0"}}>
        <div className="pih-parts">
          <div className="thumb"><img src={A+"/products/aitken/p70010-1.jpg"} alt="Aitken quartz lamp replacement element"/></div>
          <div className="m">
            <span className="eb">Genuine Factory Parts</span>
            <b>We carry replacement quartz lamp elements.</b>
            <span className="sub">Solar Beam heaters use replaceable Aitken quartz lamp elements (butt-socket &amp; pigtail) — stocked by wattage &amp; voltage.</span>
          </div>
          <a className="btn btn-red" href="aitken-elements.html">View quartz elements <I.chevR width="15" height="15"/></a>
        </div>
      </section>

      <section className="band">
        <div className="band-shade" style={{background:"var(--prp-ink)"}}></div>
        <div className="wrap band-inner">
          <span className="eb">Heating an outdoor space?</span>
          <h2>We&rsquo;ll Spec the Beam &amp; Wattage</h2>
          <ul>
            <li><i className="tri">&#9656;</i>Tell us the area, mounting height &amp; voltage available</li>
            <li><i className="tri">&#9656;</i>Aitken Solar Beam 60° &amp; 90° · 1,000–5,000 W · all-weather</li>
            <li><i className="tri">&#9656;</i>Replaceable quartz elements, fast quotes &amp; nationwide shipping</li>
          </ul>
          <a className="btn btn-red btn-lg" href="contact.html">Request a Quote</a>
        </div>
      </section>
      <Footer />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
