<style>
.dfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.dfcard{display:flex;flex-direction:column;border:1px solid var(--prp-gray-150);border-radius:12px;overflow:hidden;background:#fff;text-decoration:none;color:var(--prp-ink);transition:border-color .15s,box-shadow .15s,transform .15s}
.dfcard:hover{border-color:var(--prp-red);box-shadow:0 8px 22px rgba(0,0,0,.10);transform:translateY(-2px)}
.dfcard .ph{height:210px;background:#fff;border-bottom:1px solid var(--prp-gray-100,#f3f4f6);display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
.dfcard .ph img{max-width:100%;max-height:100%;object-fit:contain}
.dfcard .body{padding:15px 16px 16px;display:flex;flex-direction:column;flex:1}
.dfcard .brand{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--prp-red)}
.dfcard .model{font-weight:900;font-size:19px;letter-spacing:.01em;margin-top:2px;line-height:1.2}
.dfcard .btu{font-size:15px;font-weight:800;color:var(--prp-ink);margin-top:8px}
.dfcard .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.dfcard .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--prp-gray-100,#f1f3f5);color:var(--fg-2,#4a5568)}
.dfcard .tag.duct{background:#eaf5ec;color:#1f7a3d}
.dfcard .tag.noduct{background:#fdecea;color:#b5392a}
.dfcard .desc{font-size:13.5px;color:var(--fg-2,#4a5568);line-height:1.5;margin-top:11px}
.dfcard .cta{margin-top:auto;padding-top:13px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dfcard .quote{font-size:13px;font-weight:800;color:#fff;background:var(--prp-red);padding:8px 14px;border-radius:8px}
.dfcard .specs{font-size:12.5px;font-weight:700;color:var(--prp-red);display:inline-flex;align-items:center;gap:3px}
.dfnote{font-size:13px;color:var(--fg-3,#7a8794);margin:2px 0 18px;max-width:880px;line-height:1.55}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="site.jsx?v=23"></script>
<script type="text/babel">
const A = PRP_A, I = PRP_I, CAT = PRP_CAT;
const HEATERS = [
  { model:"Heat Wagon DG Series", brand:"Heat Wagon", btu:"250 & 400,000 BTU", duct:"Ductable", img:"hw-dg.jpg",
    desc:"Compact dual-rated portable direct-fired heater — efficient forced-air heat for jobsites, shops and agricultural buildings.",
    cat:CAT+"/viewitems/-gas-fired-heating-industrial-direct-fired-heaters/heat-wagon-dg-series-portable-direct-fired-heater" },
  { model:"Sure Flame S405", brand:"Sure Flame", btu:"400,000 BTU", duct:"Ductable", img:"s405.jpg",
    desc:"Rugged 400,000 BTU portable direct-fired heater built for construction and temporary heat in open and well-ventilated spaces.",
    cat:CAT+"/viewitems/-gas-fired-heating-industrial-direct-fired-heaters/portable-direct-fired-sure-flame-s405-heaters" },
  { model:"Heat Wagon 1800B", brand:"Heat Wagon", btu:"750,000 BTU", duct:"Ductable to 25'", img:"hw1800b.jpg",
    desc:"High-output 750,000 BTU forced-air heater, ductable up to 25 feet — ideal for drying, curing and large open-area heating.",
    cat:CAT+"/viewitems/-gas-fired-heating-industrial-direct-fired-heaters/d-heaters-portable-direct-fired-heat-wagon-hw1800b" },
  { model:"Heat Wagon 950H Series", brand:"Heat Wagon", btu:"950,000 BTU", duct:"Ductable", img:"hw950h.jpg",
    desc:"950,000 BTU ductable direct-fired heater delivering powerful, consistent forced-air heat for demanding industrial applications.",
    cat:CAT+"/viewitems/-gas-fired-heating-industrial-direct-fired-heaters/ired-heaters-portable-direct-fired-heat-wagon-950h" },
  { model:"Sure Flame S1505B", brand:"Sure Flame", btu:"1,500,000 BTU", duct:"Not ductable", img:"s1505b.jpg",
    desc:"Heavy-duty 1.5 million BTU direct-fired heater for very large open spaces where maximum heat output is the priority.",
    cat:CAT+"/viewitems/-gas-fired-heating-industrial-direct-fired-heaters/ed-heaters-portable-direct-fired-sure-flame-s1505b" },
  { model:"Heat Wagon HW2730C Series", brand:"Heat Wagon", btu:"2,000,000 BTU", duct:"Ductable", img:"hw2730c.jpg",
    desc:"Top-of-the-line 2 million BTU ductable direct-fired heater for the largest structures, drying jobs and temporary heat projects.",
    cat:CAT+"/viewitems/-gas-fired-heating-industrial-direct-fired-heaters/portable-direct-fired-heat-wagon-hw2730" },
];
function DuctTag({ duct }) {
  const no = /not/i.test(duct);
  return <span className={"tag "+(no?"noduct":"duct")}>{no ? "Not ductable" : duct}</span>;
}
function Card({ h }) {
  const quoteHref = "contact.html?product="+encodeURIComponent(h.brand+" "+h.model);
  return (
    <div className="dfcard">
      <div className="ph"><img src={A+"/products/direct-fired/"+h.img} alt={h.brand+" "+h.model}/></div>
      <div className="body">
        <div className="brand">{h.brand}</div>
        <div className="model">{h.model}</div>
        <div className="btu">{h.btu}</div>
        <div className="tags"><span className="tag">Portable · Direct-Fired</span><DuctTag duct={h.duct}/></div>
        <div className="desc">{h.desc}</div>
        <div className="cta">
          <a className="quote" href={quoteHref}>Request a Quote</a>
          <a className="specs" href={h.cat} target="_blank" rel="noreferrer">Full specs <I.chevR width="14" height="14"/></a>
        </div>
      </div>
    </div>
  );
}
function App() {
  return (
    <React.Fragment>
      <Header active="Gas Heating" />
      <div className="pagehero light"><div className="wrap">
        <div className="eyebrow">Gas-Fired · Industrial Heating</div>
        <h1>Direct-Fired Heaters</h1>
        <p>Portable industrial direct-fired heaters from Heat Wagon and Sure Flame — forced-air heat from 250,000 up to 2,000,000 BTU. High-efficiency units for construction, agriculture, drying, curing and heating large open spaces, with ductable models available.</p>
      </div></div>
      <div className="wrap crumb"><a href="index.html">Home</a><I.chevR width="14" height="14"/><a href="gas-heating.html">Gas Heating</a><I.chevR width="14" height="14"/><span>Direct-Fired Heaters</span></div>
      <section className="wrap section" style={{paddingTop:"10px"}}>
        <div className="eyebrow-row"><h2><span className="lt">PORTABLE</span> DIRECT-FIRED HEATERS</h2></div>
        <p className="dfnote">Direct-fired heaters burn fuel and blow the heated air straight into the space for near-100% efficiency — best in open or well-ventilated areas. Direct-fired units should not be used in occupied, enclosed spaces; for those, see our indirect-fired heaters. Tell us your space and we&rsquo;ll size the right unit.</p>
        <div className="dfgrid">{HEATERS.map((h,i)=><Card h={h} key={i}/>)}</div>
      </section>
      <section className="band">
        <div className="band-shade" style={{background:"var(--prp-ink)"}}></div>
        <div className="wrap band-inner">
          <span className="eb">Not sure which size?</span>
          <h2>We&rsquo;ll Size It For Your Space</h2>
          <ul>
            <li><i className="tri">&#9656;</i>Tell us your square footage, ceiling height &amp; fuel (NG or propane)</li>
            <li><i className="tri">&#9656;</i>Heat Wagon &amp; Sure Flame direct-fired units · 250k–2,000,000 BTU</li>
            <li><i className="tri">&#9656;</i>Fast quotes, genuine factory parts &amp; nationwide LTL shipping</li>
          </ul>
          <a className="btn btn-red btn-lg" href="contact.html">Request a Quote</a>
        </div>
      </section>
      <Footer />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
