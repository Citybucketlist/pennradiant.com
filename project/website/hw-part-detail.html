<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heat Wagon Replacement Part — Penn Radiant</title>
<meta name="description" content="Heat Wagon and Sure Flame replacement part detail from Penn Radiant: photo, description, 2026-2027 list price, and every heater model the part fits.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://www.pennradiant.com/hw-part-detail.html">
<meta property="og:type" content="product">
<meta property="og:site_name" content="Penn Radiant Products">
<meta property="og:image" content="https://www.pennradiant.com/assets/headers/parts.jpg">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="styles.css?v=68">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <link rel="shortcut icon" href="favicon.ico">
<script src="hw-parts-data.js?v=2"></script>
<style>
.pd-wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:38px;align-items:start}
@media(max-width:820px){.pd-wrap{grid-template-columns:1fr;gap:22px}}
.pd-gallery .main{position:relative;height:380px;background:#fff;border:1px solid var(--prp-gray-150);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:22px;overflow:hidden}
.pd-gallery .main.zoomable{cursor:zoom-in}
.pd-gallery .main img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .18s ease-out}
.pd-gallery .main img.ctx{opacity:.92}
.pd-ctxcap{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);border-top:1px solid var(--prp-gray-150);font-size:12px;color:var(--fg-3,#7a8794);padding:7px 12px;text-align:center}
.pd-zoom-btn{position:absolute;bottom:12px;right:12px;width:42px;height:42px;border-radius:50%;border:1px solid var(--prp-gray-150);background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center;cursor:zoom-in;color:var(--prp-ink);box-shadow:0 2px 8px rgba(0,0,0,.14);z-index:2}
.pd-zoom-btn:hover{color:var(--prp-red);border-color:var(--prp-red)}
.pd-lightbox{position:fixed;inset:0;background:rgba(15,18,22,.9);z-index:9999;display:flex;align-items:center;justify-content:center;padding:34px;cursor:zoom-out}
.pd-lightbox img{max-width:96%;max-height:96%;object-fit:contain}
.pd-lb-close{position:absolute;top:18px;right:24px;background:none;border:none;color:#fff;cursor:pointer;opacity:.85}
.pd-thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.pd-thumbs button{width:72px;height:72px;border:1px solid var(--prp-gray-150);border-radius:8px;background:#fff;padding:6px;cursor:pointer;overflow:hidden}
.pd-thumbs button.on{border-color:var(--prp-red);box-shadow:0 0 0 1px var(--prp-red)}
.pd-thumbs img{width:100%;height:100%;object-fit:contain}
.pd-info .eyebrow{color:var(--prp-red);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:12.5px}
.pd-title{font-size:28px;font-weight:900;letter-spacing:.005em;color:var(--prp-ink);margin:6px 0 6px;line-height:1.15}
@media(max-width:820px){.pd-title{font-size:23px}}
.pd-nm{font-size:15.5px;color:var(--fg-2,#4a5568);margin:0 0 16px;line-height:1.5}
.pd-nla{border-left:3px solid #c98a00;background:#fff6e0;padding:10px 14px;border-radius:0 10px 10px 0;font-size:13.5px;color:#7a5200;margin:0 0 14px}
.pd-quote-box{border:1px solid var(--prp-gray-150);border-radius:12px;padding:18px 20px;background:var(--prp-gray-100,#f7f8f9)}
.pd-quote-box .lbl{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-3,#7a8794);font-weight:800}
.pd-quote-box .price{font-size:26px;font-weight:900;color:var(--prp-ink);margin:2px 0 12px}
.pd-quote-box .price.quote{font-size:22px}
.pd-spec{margin:20px 0 0;border-top:1px solid var(--prp-gray-150)}
.pd-spec .row{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--prp-gray-100,#eee);font-size:14.5px}
.pd-spec .k{flex:0 0 130px;color:var(--fg-3,#7a8794);font-weight:700}
.pd-spec .v{color:var(--prp-ink)}
.hw-models{margin-top:20px;border:1px solid var(--prp-gray-150);border-radius:12px;padding:16px 18px 14px;background:#fff}
.hw-models h3{font-size:15.5px;margin:0 0 8px;color:var(--prp-ink)}
.hw-models ul{margin:0 0 12px;padding-left:22px;columns:2;column-gap:28px}
@media(max-width:480px){.hw-models ul{columns:1}}
.hw-models li{font-size:14.5px;color:var(--prp-ink);padding:3px 0;break-inside:avoid}
.hw-models li a{color:var(--prp-red);font-weight:700;text-decoration:none}
.hw-models li a:hover{text-decoration:underline}
.hw-models .none{font-size:14px;color:var(--fg-2,#4a5568);margin:0 0 12px}
.hw-note{font-size:13px;color:var(--fg-2,#4a5568);line-height:1.5;margin:0;border-top:1px dashed var(--prp-gray-150);padding-top:10px}
.hw-note b{color:var(--prp-ink)}
.pd-back{display:inline-flex;align-items:center;gap:5px;color:var(--prp-red);font-weight:700;text-decoration:none;font-size:14px;margin-top:18px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="site.jsx?v=26"></script>
<script type="text/babel">
const { useState } = React;
const A = PRP_A, I = PRP_I;
const PARAMS = new URLSearchParams(window.location.search);
const PARTS = window.HW_PARTS || [], MODELS = window.HW_MODELS || [];
const PAGE = {}; MODELS.forEach(m => { if (m.page) PAGE[m.model] = m.page; });
const P = PARTS.find(x => x.id === PARAMS.get("pn"));
const money = n => "$" + Number(n).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
const brandOf = p => /^SFP$/i.test(p.prefix || "") ? "Sure Flame" : "Heat Wagon";
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

function NotFound() {
  return (<div className="wrap section" style={{textAlign:"center"}}>
    <h1>Part not found</h1>
    <p><a href="heat-wagon-parts.html">Browse Heat Wagon parts →</a></p>
  </div>);
}
function ZoomMain({ src, alt }) {
  const [zoom,setZoom] = useState(false);
  const [pos,setPos] = useState({x:50,y:50});
  const [light,setLight] = useState(false);
  const onMove = (e) => { const r = e.currentTarget.getBoundingClientRect(); setPos({ x:((e.clientX-r.left)/r.width)*100, y:((e.clientY-r.top)/r.height)*100 }); };
  return (
    <React.Fragment>
      <div className="main zoomable" onMouseEnter={()=>setZoom(true)} onMouseLeave={()=>setZoom(false)} onMouseMove={onMove} onClick={()=>setLight(true)}>
        <img src={src} alt={alt} style={{transform: zoom?"scale(2.3)":"scale(1)", transformOrigin: pos.x+"% "+pos.y+"%"}}/>
        <button className="pd-zoom-btn" aria-label="Enlarge image" onClick={(e)=>{e.stopPropagation(); setLight(true);}}><I.search width="19" height="19"/></button>
      </div>
      {light && <div className="pd-lightbox" onClick={()=>setLight(false)}>
        <img src={src} alt={alt}/>
        <button className="pd-lb-close" aria-label="Close"><I.x width="26" height="26"/></button>
      </div>}
    </React.Fragment>
  );
}
function Detail({ p }) {
  const gal = (p.gallery && p.gallery.length) ? p.gallery : null;
  const [sel,setSel] = useState(0);
  const brand = brandOf(p);
  const title = brand + " " + cap(p.nm) + ", " + p.pn;
  const quoteHref = "contact.html?part=" + encodeURIComponent(p.pn + " " + p.nm);
  return (
    <React.Fragment>
      <div className="wrap crumb"><a href="index.html">Home</a><I.chevR width="14" height="14"/><a href="parts.html">Parts</a><I.chevR width="14" height="14"/><a href="heat-wagon-parts.html">Heat Wagon</a><I.chevR width="14" height="14"/><span>{p.pn}</span></div>
      <section className="wrap section" style={{paddingTop:"6px"}}>
        <div className="pd-wrap">
          <div className="pd-gallery">
            {gal
              ? <ZoomMain src={A+"/products/"+gal[sel]} alt={title}/>
              : p.context
                ? <div className="main"><img className="ctx" src={A+"/products/"+p.context} alt={brand+" heater this part fits"}/><div className="pd-ctxcap">Representative heater shown. Part photo coming soon.</div></div>
                : <div className="main"><span style={{color:"#9aa6b0",fontStyle:"italic"}}>Image coming soon</span></div>}
            {gal && gal.length>1 && <div className="pd-thumbs">{gal.map((g,i)=>(
              <button key={i} className={i===sel?"on":""} onClick={()=>setSel(i)}><img src={A+"/products/"+g} alt=""/></button>
            ))}</div>}
          </div>
          <div className="pd-info">
            <div className="eyebrow">{brand} · Replacement Part</div>
            <h1 className="pd-title">{title}</h1>
            {p.desc && p.desc.toLowerCase() !== p.nm.toLowerCase() && <p className="pd-nm">{p.desc}</p>}
            {p.nla && <div className="pd-nla">This part is no longer available from the factory. Call us and we will find the right replacement.</div>}
            <div className="pd-quote-box">
              <div className="lbl">{p.price != null ? "List Price" : "Price"}</div>
              <div className={"price" + (p.price != null ? "" : " quote")}>{p.price != null ? money(p.price) : "Request a Quote"}</div>
              <a className="btn btn-red btn-lg" href={quoteHref} style={{width:"100%",justifyContent:"center"}}>Get a Quote</a>
            </div>
            <div className="pd-spec">
              <div className="row"><span className="k">Part #</span><span className="v"><b>{p.pn}</b></span></div>
              <div className="row"><span className="k">Description</span><span className="v">{cap(p.nm)}</span></div>
              <div className="row"><span className="k">Brand</span><span className="v">{brand}</span></div>
            </div>
            <div className="hw-models">
              <h3>Models Include:</h3>
              {p.models && p.models.length
                ? <ul>{p.models.map(m => <li key={m}>{PAGE[m] ? <a href={PAGE[m]}>{m}</a> : m}</li>)}</ul>
                : <p className="none">Fitment not listed for this part. Check your owner's parts manual or call us with your model and serial number.</p>}
              <p className="hw-note"><b>NOTE:</b> Heat Wagon parts can often be used on more than one model, so always reference your owner's parts manual to make sure you order the correct part.</p>
            </div>
            <a className="pd-back" href="heat-wagon-parts.html"><I.chevR width="15" height="15" style={{transform:"rotate(180deg)"}}/> All Heat Wagon parts</a>
          </div>
        </div>
        <p className="prp-caption" style={{marginTop:"22px"}}>List prices shown are Heat Wagon 2026-2027 list prices and may change. Confirm current pricing and availability at 1.800.438.2503.</p>
      </section>
    </React.Fragment>
  );
}
function App() {
  return (<React.Fragment><Header active="Parts" />{P ? <Detail p={P} /> : <NotFound/>}<Footer /></React.Fragment>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
