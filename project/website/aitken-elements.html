<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="styles.css?v=68">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <link rel="shortcut icon" href="favicon.ico">
<script src="aitken-data.js?v=1"></script>
<style>
.elgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:15px}
.elcard{display:flex;flex-direction:column;border:1px solid var(--prp-gray-150);border-radius:10px;overflow:hidden;background:#fff;text-decoration:none;color:var(--prp-ink);transition:border-color .15s,box-shadow .15s,transform .15s}
.elcard:hover{border-color:var(--prp-red);box-shadow:0 6px 18px rgba(0,0,0,.09);transform:translateY(-2px)}
.elcard .ph{height:148px;background:#fff;border-bottom:1px solid var(--prp-gray-100,#f3f4f6);display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}
.elcard .ph img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.elcard .body{padding:11px 12px 13px;display:flex;flex-direction:column;flex:1}
.elcard .pn{font-weight:900;font-size:16px;letter-spacing:.02em;color:var(--prp-ink)}
.elcard .sp{font-size:12px;color:var(--fg-2,#4a5568);margin-top:3px;line-height:1.3}
.elcard .pr{font-weight:900;font-size:15px;color:var(--prp-ink);margin-top:9px}
.elcard .q{margin-top:auto;padding-top:9px;font-size:12px;font-weight:800;color:var(--prp-red);display:flex;align-items:center;gap:4px}
.elnote{font-size:13px;color:var(--fg-3,#7a8794);margin:2px 0 16px;max-width:820px;line-height:1.5}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="site.jsx?v=24"></script>
<script type="text/babel">
const A = PRP_A, I = PRP_I;
const PARTS = window.AITKEN_PARTS || [];
const ELEC = PARTS.filter(p=>p.cat==="electric");
const isUrod = p => /u-?rod/i.test((p.specs&&p.specs.type)||"");
const UROD = ELEC.filter(isUrod);
const STRAIGHT = ELEC.filter(p=>!isUrod(p));
const QUARTZ = PARTS.filter(p=>p.cat==="quartz");
const u = (v,suf) => v ? (/[A-Za-z]$/.test(v)?v:v+suf) : "";
function specLine(e){
  const s = e.specs||{};
  const wv = [u(s.watts,"W"), u(s.volts,"V")].filter(Boolean).join(" / ");
  if(e.cat==="quartz") return [s.type, wv].filter(Boolean).join("  \u00b7  ");
  return [wv, s.type].filter(Boolean).join("  \u00b7  ");
}
function price(e){ return e.price!=null ? "$"+e.price.toFixed(2) : null; }
function ElCard({e}){
  const img = e.gallery && e.gallery[0];
  return (
    <a className="elcard" href={"aitken-element.html?pn="+encodeURIComponent(e.pn)}>
      <div className="ph">{img ? <img src={A+"/products/"+img} alt={"Aitken "+e.pn}/> : null}</div>
      <div className="body">
        <div className="pn">{e.pn}</div>
        <div className="sp">{specLine(e)}</div>
        {price(e) && <div className="pr">{price(e)}</div>}
        <div className="q">View details <I.chevR width="14" height="14"/></div>
      </div>
    </a>
  );
}
function App(){
  return (<React.Fragment>
    <Header active="Parts" />
    <div className="pagehero light"><div className="wrap">
      <div className="eyebrow">Aitken · Replacement Heating Elements</div>
      <h1>Aitken Replacement Elements</h1>
      <p>Genuine Aitken replacement heating elements for electric infrared and quartz heaters — metal-sheath U-rod elements and quartz lamp / butt-socket elements, by wattage &amp; voltage. Net prices shown; confirm current pricing &amp; availability at 1.800.438.2503.</p>
    </div></div>
    <div className="wrap crumb"><a href="index.html">Home</a><I.chevR width="14" height="14"/><a href="parts.html">Parts</a><I.chevR width="14" height="14"/><span>Aitken Elements</span></div>
    <section className="wrap section" style={{paddingTop:"10px"}}>
      <div className="eyebrow-row"><h2><span className="lt">U-ROD</span> ELEMENTS</h2></div>
      <p className="elnote">Heavy-duty metal-sheath U-rod replacement elements — select by wattage &amp; voltage.</p>
      <div className="elgrid">{UROD.map((e,i)=><ElCard e={e} key={i}/>)}</div>
    </section>
    <section className="wrap section" style={{paddingTop:"0"}}>
      <div className="eyebrow-row"><h2><span className="lt">STRAIGHT</span> ELEMENTS</h2></div>
      <p className="elnote">Straight metal-sheath replacement elements for Aitken EXS / EXD process-module heaters.</p>
      <div className="elgrid">{STRAIGHT.map((e,i)=><ElCard e={e} key={i}/>)}</div>
    </section>
    <section className="wrap section" style={{paddingTop:"0"}}>
      <div className="eyebrow-row"><h2><span className="lt">QUARTZ LAMP</span> ELEMENTS</h2></div>
      <p className="elnote">Quartz lamp &amp; butt-socket replacement elements.</p>
      <div className="elgrid">{QUARTZ.map((e,i)=><ElCard e={e} key={i}/>)}</div>
    </section>
    <section className="band">
      <div className="band-shade" style={{background:"var(--prp-ink)"}}></div>
      <div className="wrap band-inner">
        <span className="eb">Not sure which element?</span>
        <h2>We&rsquo;ll Match Your Heater</h2>
        <ul>
          <li><i className="tri">&#9656;</i>Send your heater model &amp; the element wattage / voltage</li>
          <li><i className="tri">&#9656;</i>Aitken U-rod, quartz lamp &amp; butt-socket elements in stock</li>
          <li><i className="tri">&#9656;</i>Fast quotes &amp; nationwide shipping</li>
        </ul>
        <a className="btn btn-red btn-lg" href="contact.html">Request a Quote</a>
      </div>
    </section>
    <Footer />
  </React.Fragment>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
