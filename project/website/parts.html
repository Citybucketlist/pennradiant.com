<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replacement Parts — Penn Radiant</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="styles.css?v=66">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="site.jsx?v=14"></script>
<script type="text/babel">
const A = PRP_A, CAT = PRP_CAT, I = PRP_I;

const BRANDS = [
  { nm:"Space Ray Replacement Parts", img:"box/tube-parts-new.jpg", desc:"Burner heads, electrodes, controls & motors", href:CAT+"/category/ater-replacement-parts-space-ray-replacement-parts" },
  { nm:"Heat Wagon Factory Parts", img:"box/ceramic-parts.jpg", desc:"Browse by model — burners, motors, controls, pipe trains", href:"heat-wagon-parts.html" },
  { nm:"Sure Flame Factory Parts", img:"ceramic-heater-parts.png", desc:"Factory replacement parts by Sure Flame model", href:"sure-flame-parts.html" },
  { nm:"Space Ray / SunStar Motor Kit", img:"tube-heater-parts.png", desc:"Combustion blower motor replacement kit · 42928000", href:CAT+"/viewitems/all-categories-parts/s-space-ray-sunstar-motor-replacement-kit-42928000" },
  { nm:"SunStar Replacement Parts", img:"ceramic-heater.png", desc:"Factory replacement parts for SunStar heaters", href:CAT+"/category/eplacement-parts-sunstar-factory-replacement-parts" },
];
const ELEMENTS = [
  { nm:"Aitken Elements", img:"cat-electric.jpg", desc:"Electric infrared replacement elements", href:CAT+"/category/all-categories-parts-aitken-elements" },
  { nm:"Fostoria / TPI Elements", img:"box/replacement-elements.jpg", desc:"Metal-sheath replacement heating elements", href:CAT+"/category/all-categories-parts-fostoria-tpi-elements" },
  { nm:"Sure Flame Torch Parts", img:"torch.jpg", desc:"ST2 / ST3 torch heads & torch replacement parts", href:CAT+"/viewitems/gas-fired-heating/g-sure-flame-st2-st3-torch-heads-replacement-parts" },
  { nm:"Gas Regulators", img:"regulator.png", desc:"High & low pressure · natural gas & propane", href:CAT+"/category/gas-regulators-2" },
  { nm:"Schaefer WayCool / ProKool Pads", img:"cat-cooling.jpg", desc:"Evaporative cooler replacement pads & cleaner", href:CAT+"/category/r-waycool-schaefer-prokool-replacment-pads-cleaner" },
  { nm:"Heat Wagon i36 Fan Parts", img:"../hw-heaters/i36.jpg", desc:"Replacement fan parts for the i36 mancooler", href:CAT+"/category/categories-cooling-equipment-fan-replacement-parts" },
];

function SCard({ c }) {
  const ext = /^https?:/.test(c.href);
  return (
    <a className="scard parts" href={c.href} {...(ext?{target:"_blank",rel:"noreferrer"}:{})}>
      <span className="tab"></span>
      <div className="scard-row">
        <div className="scard-text">
          <div className="nm">{c.nm}<I.chevR width="20" height="20"/></div>
          <div className="desc">{c.desc}</div>
        </div>
        <img className="scard-thumb" src={A+"/products/"+c.img} alt={c.nm}/>
      </div>
    </a>
  );
}

function App() {
  return (
    <React.Fragment>
      <Header active="Parts" />
      <div className="pagehero light"><div className="wrap">
        <div className="eyebrow">Genuine Factory Parts</div>
        <h1>Replacement Parts</h1>
        <p>Genuine replacement parts for Space-Ray, Heat Wagon, Sure Flame, SunStar, Aitken, Fostoria/TPI and Schaefer — burners, motors, electrodes, controls, elements, regulators and more. Can’t find it? Our parts experts will track it down.</p>
      </div></div>
      <div className="wrap crumb"><a href="index.html">Home</a><I.chevR width="14" height="14"/><span>Parts</span></div>

      <section className="wrap section" style={{paddingTop:"10px"}}>
        <div className="eyebrow-row"><h2><span className="lt">PARTS BY</span> BRAND</h2></div>
        <div className="scards">{BRANDS.map((c,i)=><SCard c={c} key={i}/>)}</div>
      </section>

      <section className="wrap section" style={{paddingTop:"0"}}>
        <div className="eyebrow-row"><h2><span className="lt">ELEMENTS,</span> TORCHES &amp; ACCESSORIES</h2></div>
        <div className="scards">{ELEMENTS.map((c,i)=><SCard c={c} key={i}/>)}</div>
      </section>

      <section className="pf"><div className="wrap pf-inner">
        <img className="pf-icon" src={A+"/products/cat-parts.jpg"} alt=""/>
        <div className="pf-lbl">Replacement<b>Parts Finder</b></div>
        <div className="pf-field">
          <div className="h">Have a part number or model? We’ll match the exact part.</div>
          <div className="pf-input">
            <I.search width="20" height="20"/>
            <input placeholder="Part # or Item Name" onKeyDown={e=>{if(e.key==="Enter")window.open(CAT,"_blank");}}/>
            <a className="btn btn-red btn-sm" href={CAT} target="_blank" rel="noreferrer">Find</a>
          </div>
        </div>
      </div></section>

      <section className="band">
        <div className="band-shade" style={{background:"var(--prp-ink)"}}></div>
        <div className="wrap band-inner">
          <span className="eb">Can’t find your part?</span>
          <h2>We’ll Track It Down</h2>
          <ul>
            <li><i className="tri">▸</i>Send your model &amp; serial number — we match the exact part</li>
            <li><i className="tri">▸</i>Decades of Space-Ray, Heat Wagon &amp; Sure Flame parts experience</li>
            <li><i className="tri">▸</i>Fast quotes &amp; nationwide LTL shipping</li>
          </ul>
          <a className="btn btn-red btn-lg" href="contact.html">Contact a Parts Expert</a>
        </div>
      </section>

      <Footer />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
