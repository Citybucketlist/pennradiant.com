<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:var(--font-sans);color:var(--fg-1);background:#fff}
body{padding:24px 26px}
.row{display:flex;gap:12px;align-items:center}
.svg-icon{width:22px;height:22px;stroke-width:2}

.btn{font-family:var(--font-sans);font-weight:700;font-size:16px;border:0;border-radius:var(--r-md);padding:12px 22px;cursor:pointer;transition:background .16s,transform .06s}
.primary{background:var(--prp-red);color:#fff}.primary:hover{background:var(--prp-red-dark)}
.secondary{background:var(--prp-blue);color:#fff}.secondary:hover{background:var(--prp-blue-dark)}
.outline{background:transparent;color:var(--prp-charcoal);box-shadow:inset 0 0 0 2px var(--prp-gray-300)}
.outline:hover{box-shadow:inset 0 0 0 2px var(--prp-charcoal)}
.onhero{background:var(--bg-hero);padding:16px;border-radius:var(--r-md);margin-top:14px;gap:12px}
.wt{background:#fff;color:var(--prp-blue)}
.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.85)}

</style></head><body><div class="prp-eyebrow" style="margin-bottom:12px">Buttons</div>
<div class="row">
<button class="btn primary">Request a Quote</button>
<button class="btn secondary">Shop All Products</button>
<button class="btn outline">View Specs</button>
</div>
<div class="row onhero">
<button class="btn wt">Shop All Products</button>
<button class="btn ghost">Request a Quote</button>
</div><script>lucide.createIcons();</script></body></html>
