<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:var(--font-sans);color:var(--fg-1);background:#fff}
body{padding:26px 28px}
.row{display:flex;gap:18px}
.sw{flex:1;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--prp-gray-150)}
.chip{height:104px;display:flex;align-items:flex-end;padding:12px;color:#fff;font-weight:800;font-size:14px}
.meta{padding:11px 13px}
.name{font-weight:800;font-size:16px}
.hex{font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums;text-transform:uppercase;margin-top:2px}
.role{font-size:12px;color:var(--fg-2);margin-top:5px;line-height:1.35}
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--prp-red)">Primary</div><div class="meta"><div class="name">Brand Red</div><div class="hex">#ED1D24</div><div class="role">Logo banner, section tags, primary CTAs, spec bullets.</div></div></div>
<div class="sw"><div class="chip" style="background:var(--prp-blue)">Primary</div><div class="meta"><div class="name">PRP Blue</div><div class="hex">#0A6FB0</div><div class="role">Hero, links, headers, secondary buttons.</div></div></div>
</div>
</body></html>
