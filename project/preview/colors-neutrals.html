<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:var(--font-sans);color:var(--fg-1);background:#fff}
body{padding:26px 28px}
.row{display:flex;gap:14px}
.col{display:flex;flex-direction:column}

.scale{display:flex;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--prp-gray-150)}
.n{flex:1;height:64px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:10px;color:var(--fg-3)}
.lab{display:flex;margin-top:8px}
.lab span{flex:1;text-align:center;font-size:11px;color:var(--fg-3);font-weight:600}

</style></head><body><div class="scale">
<div class="n" style="background:var(--prp-ink)"></div>
<div class="n" style="background:var(--prp-charcoal)"></div>
<div class="n" style="background:var(--prp-gray-700)"></div>
<div class="n" style="background:var(--prp-gray-500)"></div>
<div class="n" style="background:var(--prp-gray-300)"></div>
<div class="n" style="background:var(--prp-gray-150)"></div>
<div class="n" style="background:var(--prp-gray-100)"></div>
<div class="n" style="background:#fff;box-shadow:inset 0 0 0 1px var(--prp-gray-150)">white</div>
</div>
<div class="lab"><span>ink</span><span>charcoal</span><span>700</span><span>500</span><span>300</span><span>150</span><span>100</span><span>white</span></div></body></html>
