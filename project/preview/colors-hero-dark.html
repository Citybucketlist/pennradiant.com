<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:var(--font-sans);color:var(--fg-1);background:#fff}
body{padding:26px 28px}
.row{display:flex;gap:14px}
.col{display:flex;flex-direction:column}

.sw{flex:1;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--prp-gray-150)}
.chip{height:88px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:700;font-size:13px}
.meta{padding:9px 11px}.name{font-weight:700;font-size:14px}.hex{font-size:12px;color:var(--fg-3)}

</style></head><body><div class="row">
<div class="sw col"><div class="chip" style="background:var(--bg-hero)">Hero gradient</div><div class="meta"><div class="name">Hero Blue Gradient</div><div class="hex">#0A6FB0 → #0C5D8F → #093A5A</div></div></div>
<div class="sw col"><div class="chip" style="background:var(--prp-navy)">Deep navy</div><div class="meta"><div class="name">Navy</div><div class="hex">#093A5A</div></div></div>
<div class="sw col"><div class="chip" style="background:var(--prp-ink)">Dark band</div><div class="meta"><div class="name">Ink / Feature band</div><div class="hex">#1C1C1E</div></div></div>
</div></body></html>
