<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:var(--font-sans);color:var(--fg-1);background:#fff}
body{padding:26px 28px}
.row{display:flex;gap:14px}
.col{display:flex;flex-direction:column}

.eyebrow{margin-bottom:8px}
.disp{font-weight:900;font-style:italic;font-size:46px;line-height:1.0;letter-spacing:-.01em}
.disp .red{color:var(--prp-red)}
.cap{margin-top:12px;font-size:12px;color:var(--fg-3)}

</style></head><body><div class="prp-eyebrow eyebrow">Display · 900 italic</div>
<div class="disp">Industrial Infrared<br>Heating &amp; <span class="red">Cooling</span></div>
<div class="cap">Source Sans 3 Black Italic · hero headlines · Myriad Pro substitute</div></body></html>
