<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:var(--font-sans);color:var(--fg-1);background:#fff}
body{padding:26px 28px}
.row{display:flex;gap:14px}
.col{display:flex;flex-direction:column}

.r{display:flex;align-items:baseline;gap:14px;padding:7px 0;border-bottom:1px solid var(--prp-gray-150)}
.r:last-child{border:0}
.t{flex:1}.m{font-size:11px;color:var(--fg-3);width:90px;text-align:right;font-variant-numeric:tabular-nums}

</style></head><body>
<div class="r"><div class="t prp-h1">Heading One</div><div class="m">900 · 40px</div></div>
<div class="r"><div class="t prp-h2">Heading Two</div><div class="m">800 · 30px</div></div>
<div class="r"><div class="t prp-h3">Heading Three</div><div class="m">700 · 22px</div></div>
<div class="r"><div class="t prp-body">Body — clean, plain-spoken industrial copy.</div><div class="m">400 · 17px</div></div>
<div class="r"><div class="t prp-caption">Caption / muted specification note</div><div class="m">400 · 13px</div></div></body></html>
