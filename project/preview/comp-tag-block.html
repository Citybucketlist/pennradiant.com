<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:var(--font-sans);color:var(--fg-1);background:#fff}
body{padding:24px 26px}
.block{border:1px solid var(--prp-gray-150);border-radius:var(--r-lg);box-shadow:var(--sh-card);overflow:hidden;background:#fff;max-width:400px}
.tag{display:inline-block;background:var(--prp-blue-bright);color:#fff;padding:11px 30px 14px 16px;clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%)}
.tag .t1{font-size:13px;font-weight:400;letter-spacing:.06em;display:block;line-height:1;white-space:nowrap}
.tag .t2{font-size:22px;font-weight:900;display:block;margin-top:3px;line-height:1;white-space:nowrap}
.body{padding:8px 16px 16px}
.spec{display:flex;gap:16px;font-size:14px;color:var(--fg-2);margin:4px 0 12px}
.spec span{display:flex;align-items:center;gap:6px}
.tri{color:var(--prp-red);font-size:11px}
img{width:100%;display:block;border-radius:var(--r-sm);background:#fff}
</style></head><body>
<div class="prp-eyebrow" style="margin-bottom:12px">Signature category block — angled tag</div>
<div class="block">
<div class="tag"><span class="t1">HIGH INTENSITY</span><span class="t2">DIRECT FIRED HEATERS</span></div>
<div class="body">
<div class="spec"><span><i class="tri">▸</i>Natural</span><span><i class="tri">▸</i>Propane</span><span><i class="tri">▸</i>110k–1.5M Btu</span></div>
<img src="../assets/products/cat-heating.jpg" alt="direct fired heater">
</div></div>
</body></html>
