<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:var(--font-sans);color:var(--fg-1);background:#fff}
body{padding:26px 28px}
.row{display:flex;gap:14px}
.col{display:flex;flex-direction:column}

.b{display:flex;flex-direction:column;align-items:center;gap:8px}
.box{width:84px;height:60px;background:var(--prp-gray-100);border:1px solid var(--prp-gray-300)}
.l{font-size:11px;color:var(--fg-3);font-weight:600}

</style></head><body><div class="row" style="gap:22px">
<div class="b"><div class="box" style="border-radius:var(--r-sm)"></div><div class="l">sm · 4</div></div>
<div class="b"><div class="box" style="border-radius:var(--r-md)"></div><div class="l">md · 7</div></div>
<div class="b"><div class="box" style="border-radius:var(--r-lg)"></div><div class="l">lg · 12</div></div>
<div class="b"><div class="box" style="border-radius:var(--r-pill)"></div><div class="l">pill</div></div>
</div></body></html>
