<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:var(--font-sans);color:var(--fg-1);background:#fff}
body{padding:26px 28px}
.row{display:flex;gap:14px}
.col{display:flex;flex-direction:column}

.sw{flex:1;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--prp-gray-150)}
.chip{height:64px}.meta{padding:8px 11px}.name{font-weight:700;font-size:13px}.hex{font-size:12px;color:var(--fg-3)}
.note{margin-top:14px;font-size:13px;color:var(--fg-2);line-height:1.5}
.note b{color:var(--prp-red)}

</style></head><body><div class="row">
<div class="sw col"><div class="chip" style="background:var(--usa-red)"></div><div class="meta"><div class="name">USA Red</div><div class="hex">#B22234</div></div></div>
<div class="sw col"><div class="chip" style="background:#fff;box-shadow:inset 0 0 0 1px var(--prp-gray-150)"></div><div class="meta"><div class="name">USA White</div><div class="hex">#FFFFFF</div></div></div>
<div class="sw col"><div class="chip" style="background:var(--usa-blue)"></div><div class="meta"><div class="name">USA Blue</div><div class="hex">#3C3B6E</div></div></div>
</div>
<p class="note">Heritage accent only — paired with the flag glyph beside the logo &amp; <b>"Since 1965."</b> Not for UI surfaces.</p></body></html>
