<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:var(--font-sans);color:var(--fg-1);background:#fff}
body{padding:24px 26px}
.row{display:flex;gap:12px;align-items:center}
.svg-icon{width:22px;height:22px;stroke-width:2}

.hdr{display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--prp-gray-150);padding:12px 18px;border-radius:var(--r-md) var(--r-md) 0 0}
.left{display:flex;align-items:center;gap:16px}
.left i{width:26px;height:26px;color:var(--prp-charcoal)}
.logo{height:34px}
.right{display:flex;align-items:center;gap:20px}
.right i{width:24px;height:24px;color:var(--prp-blue);stroke-width:2.2}
.phone{display:flex;align-items:center;gap:7px;color:var(--prp-charcoal);font-weight:700;font-size:15px}

</style></head><body><div class="prp-eyebrow" style="margin-bottom:12px">Site header</div>
<div class="hdr">
<div class="left"><i data-lucide="menu"></i><img class="logo" src="../assets/logos/pennradiant-logo.png"></div>
<div class="right">
<div class="phone"><i data-lucide="phone"></i>1.800.438.2503</div>
<i data-lucide="search"></i><i data-lucide="user"></i></div>
</div><script>lucide.createIcons();</script></body></html>
