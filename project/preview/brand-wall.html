<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:var(--font-sans);color:var(--fg-1);background:#fff}
body{padding:24px 26px}
.row{display:flex;gap:12px;align-items:center}
.svg-icon{width:22px;height:22px;stroke-width:2}

.wall{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;background:var(--prp-gray-100);border-radius:var(--r-md);padding:20px}
.cell{background:#fff;border-radius:var(--r-sm);height:60px;display:flex;align-items:center;justify-content:center;padding:10px}
.cell img{max-height:38px;max-width:100%;object-fit:contain}

</style></head><body><div class="prp-eyebrow" style="margin-bottom:12px">Carried brands · Space-Ray &amp; Heat Wagon lead</div>
<div class="wall">
<div class="cell"><img src="../assets/brands/space-ray.png"></div>
<div class="cell"><img src="../assets/brands/heat-wagon.png"></div>
<div class="cell"><img src="../assets/brands/sure-flame.png"></div>
<div class="cell"><img src="../assets/brands/sunstar.png"></div>
<div class="cell"><img src="../assets/brands/fostoria.jpg"></div>
<div class="cell"><img src="../assets/brands/tpi.png"></div>
<div class="cell"><img src="../assets/brands/aitken.png"></div>
<div class="cell"><img src="../assets/brands/schaefer.png"></div>
</div><script>lucide.createIcons();</script></body></html>
